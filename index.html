<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BYD Showroom Guide</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Showroom guide to the BYD Egypt line-up: prices, specs, comparisons and features.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0C0E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BYD Guide">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone app. Compact sticky app bar with the BYD mark, big page title, floating pill tab bar.
   Palette: BYD red on clean white and graphite. Blue marks electric, amber marks plug-in hybrid. */
:root{
  --bg:#F2F3F5; --card:#FFFFFF; --card-2:#F6F7F9; --field:#ECEEF1;
  --ink:#0F1114; --ink-2:#4A4F57; --ink-3:#868C95; --line:rgba(15,17,20,.08);
  --red:#E51F2A; --red-ink:#FFFFFF; --red-soft:#FDE9EA; --red-text:#C8141F;
  --ev:#1766D6; --ev-soft:#E5EEFB; --hy:#B25F0C; --hy-soft:#FAEEDF;
  --yes:#1B8F4A; --yes-soft:#E3F4EA; --warn:#8F5A00; --warn-soft:#FFF3D9;
  --bar:rgba(255,255,255,.86); --shadow:0 1px 2px rgba(15,17,20,.05),0 6px 20px rgba(15,17,20,.06);
  --f-display:"Montserrat", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:22px; --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0C0E; --card:#16181B; --card-2:#1C1F23; --field:#202328;
  --ink:#F3F4F6; --ink-2:#B4B9C1; --ink-3:#7E848D; --line:rgba(255,255,255,.08);
  --red:#FF3B45; --red-ink:#FFFFFF; --red-soft:rgba(255,59,69,.16); --red-text:#FF6B73;
  --ev:#6AA8FF; --ev-soft:rgba(106,168,255,.15); --hy:#F2A94E; --hy-soft:rgba(242,169,78,.15);
  --yes:#4FD483; --yes-soft:rgba(79,212,131,.14); --warn:#F2BE55; --warn-soft:rgba(242,190,85,.13);
  --bar:rgba(26,28,32,.86); --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B0C0E; --card:#16181B; --card-2:#1C1F23; --field:#202328;
  --ink:#F3F4F6; --ink-2:#B4B9C1; --ink-3:#7E848D; --line:rgba(255,255,255,.08);
  --red:#FF3B45; --red-ink:#FFFFFF; --red-soft:rgba(255,59,69,.16); --red-text:#FF6B73;
  --ev:#6AA8FF; --ev-soft:rgba(106,168,255,.15); --hy:#F2A94E; --hy-soft:rgba(242,169,78,.15);
  --yes:#4FD483; --yes-soft:rgba(79,212,131,.14); --warn:#F2BE55; --warn-soft:rgba(242,190,85,.13);
  --bar:rgba(26,28,32,.86); --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.12;letter-spacing:-.01em}
.small{font-size:13px;color:var(--ink-3)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:8px}
.mark{display:block;height:13px;width:auto}
.mark path{fill:none;stroke:var(--red);stroke-width:7}

/* splash: the logo draws itself, then the app fades in */
#splash{position:fixed;inset:0;z-index:100;background:var(--card);display:grid;place-items:center;transition:opacity .45s var(--ease),visibility .45s}
#splash svg{width:min(56vw,260px);height:auto;overflow:visible}
#splash path{fill:none;stroke:var(--red);stroke-width:7;stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1s var(--ease) forwards}
#splash path:nth-child(2){animation-delay:.08s}#splash path:nth-child(3){animation-delay:.16s}#splash path:nth-child(4){animation-delay:.22s}#splash path:nth-child(5){animation-delay:.28s}#splash path:nth-child(6){animation-delay:.34s}
#splash .sub{position:absolute;bottom:calc(48px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font:600 13px var(--f-display);letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3);opacity:0;animation:fade .5s .6s forwards}
#splash.out{opacity:0;visibility:hidden}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}

/* app bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px)}
header.top .wrap{padding-block:10px 10px;display:flex;flex-direction:column;gap:10px}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand .mark{height:14px}
.brand span{font:700 12.5px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
@media (max-width:350px){.datepill{display:none}}
.datepill{font:600 12px var(--f-body);color:var(--ink-2);background:var(--card);border-radius:999px;padding:5px 10px;box-shadow:var(--shadow);white-space:nowrap}
.searchbox{position:relative}
.searchbox input{width:100%;font:inherit;font-size:16px;padding:12px 44px 12px 44px;border-radius:999px;border:0;background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.searchbox input::placeholder{color:var(--ink-3)}
.searchbox svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:2.2}
.searchbox .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--field);border-radius:999px;width:28px;height:28px;color:var(--ink-2);cursor:pointer;font-size:16px;line-height:1}

/* floating pill tab bar: active tab grows to show its name */
nav.tabs{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;justify-content:center;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
nav.tabs .pill{pointer-events:auto;display:flex;gap:2px;padding:6px;border-radius:999px;background:var(--bar);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);box-shadow:0 10px 30px rgba(0,0,0,.14),0 0 0 1px var(--line);max-width:100%}
nav.tabs a{display:flex;align-items:center;gap:6px;height:44px;padding:0 13px;border-radius:999px;text-decoration:none;color:var(--ink-2);font:700 13.5px var(--f-display);white-space:nowrap;transition:background .3s var(--ease),color .3s var(--ease),padding .3s var(--ease)}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav.tabs a span{max-width:0;overflow:hidden;opacity:0;transition:max-width .35s var(--ease),opacity .25s}
nav.tabs a[aria-current="page"]{background:var(--red);color:var(--red-ink);padding:0 16px 0 13px}
nav.tabs a[aria-current="page"] span{max-width:100px;opacity:1}

main .wrap{padding-block:6px 24px;display:flex;flex-direction:column;gap:16px}
main.anim .wrap > *{animation:rise .45s var(--ease) both}
main.anim .wrap > *:nth-child(2){animation-delay:.03s} main.anim .wrap > *:nth-child(3){animation-delay:.06s} main.anim .wrap > *:nth-child(4){animation-delay:.09s} main.anim .wrap > *:nth-child(n+5){animation-delay:.12s}
.pagetitle{font-size:32px;font-weight:800;letter-spacing:-.02em;padding-top:4px}
.pagesub{color:var(--ink-2);margin-top:-8px;font-size:15px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px}
.section-h h2{font-size:21px;font-weight:800}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--card);border-radius:999px;padding:8px 14px;font:600 14px var(--f-body);cursor:pointer;color:var(--ink-2);box-shadow:var(--shadow);text-decoration:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.kind{display:inline-flex;align-items:center;gap:6px;font:700 11.5px var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:999px}
.kind.ev{background:var(--ev-soft);color:var(--ev)}
.kind.hy{background:var(--hy-soft);color:var(--hy)}
.kind::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.onimg .kind{background:rgba(255,255,255,.88);backdrop-filter:blur(8px)}
.onimg .kind.ev{color:#1766D6}.onimg .kind.hy{color:#B25F0C}

/* car list */
.cars{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:640px){.cars{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;min-width:0;box-shadow:var(--shadow);transition:transform .25s var(--ease)}
.card:active{transform:scale(.985)}
.card .ph{position:relative;aspect-ratio:16/9;background:var(--field);overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .ph .onimg{position:absolute;left:12px;top:12px}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.card .row1{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.card h3{font-size:21px;font-weight:800}
.card .type{color:var(--ink-3);font-size:13.5px}
.price{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.price small{font-size:.62em;color:var(--ink-3);font-weight:700;margin-right:3px;letter-spacing:.04em}
.card .price{font-size:17px;text-align:right}
.card .from{font-size:11.5px;color:var(--ink-3);text-align:right;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--card-2);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{font-size:12px;color:var(--ink-3)}
.card .tag{font-size:14.5px;color:var(--ink-2)}
.nobrochure{font-size:13.5px;color:var(--warn);background:var(--warn-soft);border-radius:12px;padding:8px 12px}

/* car sheet */
.back{display:inline-flex;align-items:center;gap:4px;color:var(--red-text);text-decoration:none;font-weight:700;font-size:15px;align-self:flex-start}
.hero{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.hero .ph{position:relative;aspect-ratio:16/10;background:var(--field)}
.hero .ph img{width:100%;height:100%;object-fit:cover}
.hero .ph::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(to top,rgba(0,0,0,.66),transparent)}
.hero .ph .cap{position:absolute;left:16px;right:16px;bottom:14px;z-index:1;color:#fff;display:flex;flex-direction:column;gap:6px}
.hero .ph h2{font-size:32px;font-weight:800;letter-spacing:-.02em;color:#fff}
.hero .ph .onimg{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hero .ph .typ{font-size:13.5px;color:rgba(255,255,255,.88)}
.hero .in{padding:16px;display:flex;flex-direction:column;gap:12px}
.hero .tagline{color:var(--ink-2);font-size:16px}
.trimprices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.trimprice{background:var(--card-2);border-radius:14px;padding:10px 12px}
.trimprice .t{font-size:13px;color:var(--ink-3);font-weight:600}
.trimprice .price{font-size:19px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:11px 18px;font:700 14.5px var(--f-display);cursor:pointer;text-decoration:none}
.btn.red{background:var(--red);color:var(--red-ink)}
.btn.soft{background:var(--card-2);color:var(--ink)}
.keygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.keygrid{grid-template-columns:repeat(3,1fr)}}
.kg{background:var(--card);border-radius:18px;padding:12px 14px;min-width:0;box-shadow:var(--shadow)}
.kg .v{font-family:var(--f-display);font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.01em}
.kg .v small{font-size:12.5px;font-weight:700;color:var(--ink-3);margin-left:3px}
.kg .l{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.kg .split{display:block;font-size:13.5px;color:var(--ink-2);font-family:var(--f-body);font-weight:500}
.kg .split b{font-family:var(--f-display);font-weight:800;color:var(--ink);font-size:16px}
.panel{background:var(--card);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.panel h3{font-size:18px;font-weight:800}
.pitch{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px}
.pitch li{padding-left:18px;position:relative}
.pitch li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:3px;border-radius:2px;background:var(--red)}
.qa{display:flex;flex-direction:column;gap:14px}
.qa div{background:var(--card-2);border-radius:14px;padding:12px 14px}
.qa b{display:block;font-weight:700;margin-bottom:2px}
.qa span{color:var(--ink-2)}
.diffs{width:100%;border-collapse:collapse;font-size:14.5px}
.diffs th,.diffs td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.diffs th{font:700 11.5px var(--f-display);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.yes{color:var(--yes);font-weight:800}
.no{color:var(--ink-3)}
details.spec{background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
details.spec summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;font:700 15.5px var(--f-display)}
details.spec summary::-webkit-details-marker{display:none}
details.spec summary .cnt{margin-left:auto;color:var(--ink-3);font:600 13px var(--f-body)}
details.spec summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg) translateY(-3px);transition:transform .25s var(--ease);flex:none}
details.spec[open] summary::after{transform:rotate(225deg) translateY(-1px)}
.stack{display:flex;flex-direction:column;gap:8px}
.specrows{padding:0 16px 10px;display:flex;flex-direction:column}
.sr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.sr .lab{color:var(--ink-2);min-width:0}
.sr .val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;max-width:55vw}
.sr .val .tv{display:block}
.sr .val .tv i{font-style:normal;color:var(--ink-3);font-weight:500;font-size:12.5px;margin-right:4px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{background:var(--card-2);border-radius:999px;padding:5px 12px;font-size:14px}
.note{background:var(--warn-soft);color:var(--ink);border-radius:18px;padding:14px 16px;font-size:14.5px;display:flex;flex-direction:column;gap:6px}
.note b{color:var(--warn);font-family:var(--f-display)}
.note ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.hl{background:var(--red-soft);color:var(--ink);border-radius:4px;padding:0 2px}
.insearch input{background:var(--card-2);box-shadow:none}

/* compare */
.picker{display:flex;flex-wrap:wrap;gap:8px}
.cmpwrap{overflow-x:auto;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}
table.cmp{border-collapse:collapse;width:100%;font-size:14.5px}
table.cmp th,table.cmp td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.cmp thead th{background:var(--card);font:800 14px var(--f-display);min-width:116px;vertical-align:bottom}
table.cmp thead th img{width:100%;max-width:150px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin-bottom:6px}
table.cmp tbody th{font-weight:600;color:var(--ink-2);font-size:13.5px;min-width:118px;position:sticky;left:0;background:var(--card);z-index:1}
table.cmp td{font-variant-numeric:tabular-nums;font-weight:700}
table.cmp td.best{color:var(--red-text)}
table.cmp td.best::after{content:" ▲";font-size:9px;vertical-align:2px}
table.cmp tr.grp th{background:var(--card-2);font:700 11.5px var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);position:static}
.toggle{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink-2);cursor:pointer}
.switch{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--field);position:relative;cursor:pointer;transition:background .25s;flex:none;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s var(--ease)}
.switch:checked{background:var(--red)}
.switch:checked::after{transform:translateX(18px)}

/* search */
.results{display:flex;flex-direction:column;gap:8px}
.res{background:var(--card);border-radius:16px;padding:11px 14px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:inherit;box-shadow:var(--shadow)}
.res .where{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.03em}
.res .what{display:flex;justify-content:space-between;gap:10px}
.res .what .val{font-weight:700;text-align:right}
.grouphead{display:flex;align-items:center;gap:8px;margin-top:6px}
.grouphead h3{font-size:16px;font-weight:800}
.empty{color:var(--ink-3);text-align:center;padding:30px 10px}

/* learn */
.gl{display:flex;flex-direction:column;gap:12px}
.gl .panel p{margin:0;color:var(--ink-2)}
.gl .panel .say{color:var(--ink);background:var(--red-soft);border-radius:14px;padding:11px 13px}
.gl .panel.focus{box-shadow:0 0 0 2px var(--red),var(--shadow)}
.included{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.included li{display:flex;gap:10px;align-items:flex-start}
.included li::before{content:"✓";color:var(--yes);font-weight:800}
.finder{display:flex;flex-direction:column;gap:12px}
.finder label{font:700 13px var(--f-display);color:var(--ink-2);display:block;margin-bottom:4px}
.finder select{font:inherit;padding:11px 12px;border-radius:14px;border:0;background:var(--card-2);color:var(--ink);width:100%}
.finderlink{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:14px 16px;text-decoration:none}
.finderlink b{font-family:var(--f-display);font-size:16px;font-weight:800}
.finderlink .small{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.finderlink .go{background:var(--red);color:var(--red-ink);border-radius:999px;padding:8px 14px;font:700 14px var(--f-display);white-space:nowrap}

/* feature states */
.st{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:600;line-height:1.3}
.st.y{background:var(--yes-soft);color:var(--ink)} .st.y::before{content:"✓";color:var(--yes);font-weight:800}
.st.p{background:var(--hy-soft);color:var(--ink)} .st.p::before{content:"◐";color:var(--hy)}
.st.n{background:var(--card-2);color:var(--ink-3)} .st.n::before{content:"✗"}
.st.u{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-3)} .st.u::before{content:"?"}
.st i{font-style:normal;font-weight:500;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.fcard{background:var(--card);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow)}
.fcard .fh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fcard h3{font-size:16px;font-weight:800}
.fcard .tip{font-size:14px;color:var(--ink-2)}
.fcard .count{font-size:12.5px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.fcard .sts{display:flex;flex-wrap:wrap;gap:6px}
.what{font-size:13px;color:var(--red-text);text-decoration:none;font-weight:700}
.seg{display:inline-flex;background:var(--field);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 15px;border-radius:999px;font:700 13.5px var(--f-display);cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
table.fm{border-collapse:collapse;font-size:13.5px}
table.fm th,table.fm td{border-bottom:1px solid var(--line);padding:8px;text-align:center;vertical-align:middle}
table.fm thead th{position:sticky;top:0;background:var(--card);font:800 12px var(--f-display);min-width:76px;line-height:1.15;z-index:2}
table.fm tbody th{text-align:left;font-weight:600;color:var(--ink-2);position:sticky;left:0;background:var(--card);min-width:150px;max-width:170px;z-index:1}
table.fm tr.grp th{background:var(--card-2);color:var(--ink-3);font:700 11px var(--f-display);text-transform:uppercase;letter-spacing:.08em}
table.fm td .c{font-weight:800}
table.fm td.y .c{color:var(--yes)} table.fm td.p .c{color:var(--hy)} table.fm td.n .c{color:var(--ink-3)} table.fm td.u .c{color:var(--ink-3);opacity:.55;font-weight:500}
table.fm td small{display:block;color:var(--ink-2);font-size:11.5px;line-height:1.2}
.fmwrap{overflow:auto;max-height:72vh;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}
.featlist{display:flex;flex-direction:column;padding:0 16px 10px}
.fl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px;align-items:center}
.fl .lab{color:var(--ink-2)}
.fl .val{text-align:right;font-weight:600}

/* rankings */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:24px 44px minmax(0,1fr);gap:10px;align-items:center;text-decoration:none;color:inherit}
.bar .rk{font:800 15px var(--f-display);color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:right}
.bar img{width:44px;height:30px;object-fit:cover;border-radius:7px}
.bar .bd{display:flex;flex-direction:column;gap:4px;min-width:0}
.bar .top{display:flex;justify-content:space-between;gap:8px;font-size:14.5px;font-weight:600}
.bar .top b{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums}
.bar .track{height:7px;border-radius:4px;background:var(--field);overflow:hidden}
.bar .fill{height:100%;border-radius:4px;background:var(--ink-3);transform-origin:left;animation:grow .7s var(--ease) both}
.bar.ev .fill{background:var(--ev)} .bar.hy .fill{background:var(--hy)}
.bar:first-child .rk,.bar:first-child .top b{color:var(--red-text)}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
footer.about{color:var(--ink-3);font-size:12.5px;text-align:center;padding:8px 12px 0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#splash{display:none}}
</style>
</head>

<script>
const DATA = {"priceDate":"22 Oct 2026","included":["V2L charging unit (power appliances from the car)","Original BYD home charger","Portable charging cable","Roadside assistance for 6 years, unlimited trips, free of charge","8 years / 200,000 km battery warranty"],"synonyms":{"trunk":["boot"],"luggage":["boot"],"camera":["camera","360"],"sunroof":["panoramic","sunroof"],"roof":["panoramic","roof"],"cooled":["ventilat"],"cooling":["ventilat"],"ac":["a/c","climate"],"aircon":["a/c","climate"],"screen":["touchscreen","display","instrument"],"speed":["0-100","power"],"acceleration":["0-100"],"hp":["power"],"horsepower":["power"],"fuel":["consumption","fuel"],"fast":["dc"],"cruise":["cruise"],"fridge":["refrigerator"],"tow":["tow"],"parking":["radar","parking"],"sensors":["radar","sensor"],"phone":["wireless","carplay","android"],"key":["key","nfc"],"warranty":["warranty"],"seats":["seat"],"awd":["awd","4wd","all-wheel"],"4x4":["awd","4wd","4x4"]},"glossary":[{"id":"blade","term":"BYD Blade Battery (LFP)","cars":"In every car in the line-up.","text":"BYD makes its own batteries. The Blade Battery uses long, thin cells shaped like blades and packed tightly together. The chemistry is LFP (lithium iron phosphate), which is very stable, resists overheating and lasts many charge cycles. BYD is known for its nail penetration test, where a nail is driven through a cell without causing fire or smoke.","say":"The battery is built by BYD itself and uses the safest common battery chemistry. That is why BYD backs it with 8 years or 200,000 km of warranty."},{"id":"dmi","term":"DM-i Super Plug-in Hybrid","cars":"Sealion 5 DM-i, Sealion 6 DM-i, Atto 8 DM-i, Ti7, M9 DM-i.","text":"DM-i cars mostly drive on their electric motor. The petrol engine (a 1.5 L in our brochures) mainly works as a generator and drives the wheels directly at higher speeds, when that is more efficient. You plug in at home for electric-only daily driving, and on long trips you just fill up with petrol, with no charging needed.","say":"Think of it as an electric car with its own petrol power station on board: electric for daily use, no range worry on trips."},{"id":"dmo","term":"DM-O (Dual Mode Off-Road)","cars":"Shark 6 DMO.","text":"This is BYD’s plug-in hybrid system for off-road use. The Shark 6 brochure lists it as \"DM-O AWD\": a 1.5 T engine with electric drive to all four wheels, a 29.6 kWh Blade Battery, double wishbone suspension front and rear, and Sand, Mud and Mount driving modes.","say":"It is the same smart hybrid idea, built for a 4x4: strong electric torque on all wheels, with petrol for long distances."},{"id":"evphev","term":"EV vs plug-in hybrid","text":"An EV (Dolphin Surf, Atto 2, Sealion 6 EV) runs only on its battery: no fuel, no oil changes, lowest running cost, but you need to charge. A plug-in hybrid (DM-i, DM-O) has a smaller battery for daily electric driving plus a petrol engine, so it never strands you.","say":"If you can charge at home and mostly drive in the city, go EV. If you travel a lot or cannot always charge, go plug-in hybrid."},{"id":"kw","term":"kW vs kWh","text":"kWh is how much energy the battery holds, like the size of a fuel tank. kW is how fast power flows, like how fast the pump fills the tank. Some brochures print charging power as \"kWh\". They mean kW.","say":"kWh is the size of the tank. kW is the speed of the pump."},{"id":"acdc","term":"AC vs DC charging","text":"AC is home or slow charging through the car’s on-board charger (6.6-11 kW in our line-up). DC is fast charging at public stations, which goes straight into the battery (40 kW up to 155 kW in our line-up). Brochures quote DC time from 30% to 80% because charging slows down near full to protect the battery.","say":"Home charging overnight covers daily use. DC fast charging is for road trips: think coffee-break length."},{"id":"ports","term":"CCS2 and Type 2","text":"These are the plug standards. CCS2 handles both AC and DC fast charging, and is the common standard in Egypt and Europe. Type 2 is the AC plug (the Sealion 5 brochure lists Type-2 as its port)."},{"id":"wltp","term":"WLTP range","text":"WLTP is the official European lab test for range and fuel use. It is a fair way to compare cars, but real range changes with speed, A/C use, heat, load and driving style. Fast highway driving and heavy A/C lower the range.","say":"WLTP is the official figure for comparing cars. Real range depends on how and where you drive."},{"id":"v2l","term":"V2L (Vehicle-to-Load)","cars":"Listed in all 8 brochures. The price list says the V2L unit is included with every BYD.","text":"V2L lets the car’s battery power ordinary electric devices through an adapter: a coffee machine at a picnic, a laptop, lights at a camp, or tools at a work site.","say":"Your car becomes a big power bank on wheels: plug in a kettle at the beach."},{"id":"ctc","term":"CTC (Cell to Chassis)","cars":"Mentioned in the Shark 6 brochure.","text":"The battery cells are built into the car’s structure instead of sitting in a separate box. This saves space and weight and makes the body stiffer."},{"id":"warranty","term":"Warranty and what is included","text":"The price list gives an 8-year / 200,000 km battery warranty, 6 years of free roadside assistance with unlimited trips, a V2L unit, an original BYD home charger and a portable charging cable with every BYD. Terms and conditions apply."},{"id":"acc","term":"ACC - Adaptive Cruise Control","text":"Keeps a set speed and automatically keeps a safe distance from the car ahead, slowing down and speeding up with traffic."},{"id":"cc","term":"CC - Cruise Control","text":"Basic cruise control. It holds a set speed, but does not react to the car in front. ACC is the smarter version."},{"id":"lka","term":"LKA / LDW - Lane Keep Assist / Lane Departure Warning","text":"LDW warns you when the car drifts out of its lane without signalling. LKA goes further and gently steers the car back into the lane."},{"id":"bsd","term":"BSD - Blind Spot Detection","text":"Warns you, usually with a light in the mirror, when a car is in your blind spot as you change lanes."},{"id":"cta","term":"FCTA / RCTA - Front / Rear Cross Traffic Alert","text":"Warns of cars crossing in front of or behind you when you pull out of a parking spot or a blind junction."},{"id":"fcw","term":"FCW - Front Collision Warning","text":"Warns the driver when the car is closing in too fast on the vehicle ahead."},{"id":"hma","term":"HMA - High Beam Assist","text":"Switches between high and low beam automatically, so you do not dazzle oncoming drivers."},{"id":"dms","term":"Driver monitoring and fatigue detection","text":"A camera watches for signs that the driver is tired or distracted and gives a warning. Listed in the Atto 8 brochure."},{"id":"esp","term":"ESP, TCS, EBD - stability and brakes","text":"ESP keeps the car stable in a skid or sharp turn. TCS stops the wheels spinning on slippery ground. EBD shares braking force between the wheels for shorter, straighter stops."},{"id":"ipb","term":"IPB, EPB, Auto Hold, CST","text":"IPB is BYD’s integrated electronic brake system. EPB is an electric handbrake button. Auto Hold keeps the car still at a red light without your foot on the brake. CST (Comfort Stop) smooths the last moment of braking so the car does not jerk."},{"id":"hdc","term":"HDC / HHC - Hill Descent / Hill Hold Control","text":"HDC holds a slow, steady speed down steep slopes (sand dunes, ramps). HHC stops the car rolling back when you pull away on a hill."},{"id":"tpms","term":"TPMS","text":"Tyre Pressure Monitoring System. It warns you when a tyre is losing air."},{"id":"isofix","term":"ISOFIX","text":"Standard metal anchor points for fixing child seats firmly to the car."},{"id":"hud","term":"HUD - Head-up display","text":"Projects speed and navigation onto the windscreen in front of the driver, so their eyes stay on the road. Brochures quote a 26\" HUD, which is the size of the projected image."},{"id":"nfc","term":"NFC card key / smart key","text":"Lock, unlock and start the car with a card or a phone tapped on the mirror area, as well as the normal smart key."},{"id":"awd","term":"FWD, AWD","text":"FWD means the front wheels drive the car: efficient, with more electric range. AWD means all four wheels drive it: more power, more grip on sand and wet roads, quicker acceleration. On the Ti7, the AWD version has 485 hp against 275 hp for the FWD."},{"id":"suspension","term":"Suspension types","text":"MacPherson and torsion beam are simple, light and compact (city cars). Multi-link and double wishbone keep the tyres flatter on the road for better comfort and grip (bigger SUVs and the Shark). The Ti7 AWD’s Intelligent Damping System adjusts stiffness automatically."},{"id":"turning","term":"Turning circle","text":"How much space the car needs to make a U-turn. Most brochures here print a small number (4.95-5.9 m), which is most likely the turning radius. The Shark 6 prints 13.5 m, which looks like the full circle. So do not compare the Shark’s figure directly with the others."}],"groups":{"adas":"Driver assist (ADAS)","park":"Parking & cameras","safe":"Safety","comfort":"Comfort & seats","tech":"Screens & tech","energy":"Charging & energy","off":"Off-road & utility"},"features":[{"g":"adas","n":"Adaptive cruise control (ACC)","tip":"Keeps speed and distance to the car ahead automatically.","gl":"acc"},{"g":"adas","n":"Basic cruise control","tip":"Holds a set speed only.","gl":"cc"},{"g":"adas","n":"Lane keep assist (LKA)","tip":"Steers gently back into the lane.","gl":"lka"},{"g":"adas","n":"Lane departure warning (LDW)","tip":"Warns when drifting out of lane.","gl":"lka"},{"g":"adas","n":"Blind spot detection (BSD)","tip":"Warns of cars in the blind spot.","gl":"bsd"},{"g":"adas","n":"Front cross traffic alert (FCTA)","tip":"Warns of crossing traffic ahead at junctions.","gl":"cta"},{"g":"adas","n":"Rear cross traffic alert (RCTA)","tip":"Warns of crossing traffic when reversing out.","gl":"cta"},{"g":"adas","n":"Front collision warning (FCW)","tip":"Warns when closing too fast on the car ahead.","gl":"fcw"},{"g":"adas","n":"Driver fatigue monitoring","tip":"Warns a tired or distracted driver.","gl":"dms"},{"g":"adas","n":"High beam assist (HMA)","tip":"Switches high and low beam automatically.","gl":"hma"},{"g":"park","n":"360° camera","tip":"Bird’s-eye view around the car for parking.","gl":null},{"g":"park","n":"Rear-view camera","tip":"Camera when reversing. Cars with 360° also show the rear.","gl":null},{"g":"park","n":"Front parking sensors","tip":"Beeps for obstacles in front.","gl":null},{"g":"park","n":"Rear parking sensors","tip":"Beeps for obstacles behind.","gl":null},{"g":"park","n":"Auto Hold","tip":"Holds the car at a stop without the brake pedal.","gl":"ipb"},{"g":"park","n":"Electric parking brake (EPB)","tip":"Push-button handbrake.","gl":"ipb"},{"g":"safe","n":"Airbags","tip":"Number of airbags listed in the brochure.","gl":null},{"g":"safe","n":"Far-side airbag","tip":"Airbag between front seats to stop occupants hitting each other.","gl":null},{"g":"safe","n":"Stability control (ESP)","tip":"Keeps the car stable in a skid.","gl":"esp"},{"g":"safe","n":"Traction control (TCS)","tip":"Stops wheelspin on slippery roads.","gl":"esp"},{"g":"safe","n":"Brake distribution (EBD)","tip":"Shares braking force between wheels.","gl":"esp"},{"g":"safe","n":"Intelligent Power Brake (IPB)","tip":"BYD integrated electronic braking.","gl":"ipb"},{"g":"safe","n":"Hill descent control (HDC)","tip":"Slow steady speed down steep slopes.","gl":"hdc"},{"g":"safe","n":"Hill hold control (HHC)","tip":"No rolling back on hills.","gl":"hdc"},{"g":"safe","n":"ISOFIX child seat mounts","tip":"Anchor points for child seats.","gl":"isofix"},{"g":"safe","n":"Tyre pressure monitoring (TPMS)","tip":"Warns of a tyre losing air.","gl":"tpms"},{"g":"comfort","n":"Panoramic roof","tip":"Large glass roof with sunshade.","gl":null},{"g":"comfort","n":"Ventilated front seats","tip":"Cooling air through the seats. Ideal for Egyptian summers.","gl":null},{"g":"comfort","n":"Heated front seats","tip":"Seat heating.","gl":null},{"g":"comfort","n":"Massage & memory seats","tip":"Massage and saved seat positions.","gl":null},{"g":"comfort","n":"Electric driver seat","tip":"Number of adjustment directions.","gl":null},{"g":"comfort","n":"Electric passenger seat","tip":"Number of adjustment directions.","gl":null},{"g":"comfort","n":"Power rear seat recline","tip":"Rear seats recline electrically.","gl":null},{"g":"comfort","n":"Electric tailgate","tip":"Boot opens and closes electrically.","gl":null},{"g":"comfort","n":"Multi-zone climate","tip":"Different temperatures for different seats.","gl":null},{"g":"comfort","n":"Rear A/C vents","tip":"Air vents for the back seats.","gl":null},{"g":"comfort","n":"3rd-row own A/C","tip":"Separate automatic A/C for the third row.","gl":null},{"g":"comfort","n":"Remote A/C (app)","tip":"Cool the car before you get in.","gl":null},{"g":"comfort","n":"PM2.5 air filter","tip":"Filters fine dust from cabin air.","gl":null},{"g":"comfort","n":"Ambient lighting","tip":"Interior mood lighting.","gl":null},{"g":"comfort","n":"Front fridge","tip":"Built-in cool box at the front.","gl":null},{"g":"tech","n":"Centre touchscreen","tip":"Main screen size.","gl":null},{"g":"tech","n":"Driver display","tip":"Digital dashboard size.","gl":null},{"g":"tech","n":"Head-up display (HUD)","tip":"Speed and navigation on the windscreen.","gl":"hud"},{"g":"tech","n":"Speakers","tip":"Sound system.","gl":null},{"g":"tech","n":"Wireless phone charging","tip":"Charging pad power.","gl":null},{"g":"tech","n":"Apple CarPlay & Android Auto","tip":"Phone apps on the car screen.","gl":null},{"g":"tech","n":"Voice control \"Hi, BYD\"","tip":"Talk to the car to control functions.","gl":null},{"g":"tech","n":"Onboard 4G","tip":"Built-in internet connection.","gl":null},{"g":"tech","n":"BYD app (remote control)","tip":"Lock, <script>
(function(){
const $ = s => document.querySelector(s);
const view = $('#view'), main = $('#main');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtEGP = n => n == null ? '' : n.toLocaleString('en-US');
const CARS = DATA.cars;
const byId = Object.fromEntries(CARS.map(c => [c.id, c]));
$('#pricedate').textContent = 'Prices ' + DATA.priceDate;

/* splash once per session */
const splash = $('#splash');
let seen = false; try{ seen = sessionStorage.getItem('byd-splash')==='1'; sessionStorage.setItem('byd-splash','1'); }catch(e){}
if(seen || matchMedia('(prefers-reduced-motion: reduce)').matches) splash.remove();
else setTimeout(()=>{ splash.classList.add('out'); setTimeout(()=>splash.remove(), 500); }, 1350);

function kindChip(c){ return `<span class="kind ${c.kind==='EV'?'ev':'hy'}">${esc(c.kindLabel)}</span>`; }
function priceFrom(c){ const p = c.trims.map(t=>t.price).filter(Boolean); return p.length ? Math.min(...p) : null; }
function priceHTML(n){ return n==null ? '<span class="small">Not on price list</span>' : `<span class="price"><small>EGP</small>${fmtEGP(n)}</span>`; }
function keyAll(c,k){ const vals = c.trims.map(t=>t.key && t.key[k]).filter(v=>v!=null && v!==''); return [...new Set(vals)]; }
function keyShort(c,k){ const u=keyAll(c,k); if(!u.length) return '-'; return u.join(' / '); }
const img = (c, cls='') => `<img class="${cls}" src="cars/${c.id}.jpg" alt="${esc(c.name)}" loading="lazy" decoding="async">`;

/* ---------- feature helpers ---------- */
const FEATS = DATA.features;
const BCARS = CARS.filter(c=>c.hasBrochure);
const shortName = c => c.short || c.name;
function carFeat(c,i){
  const sts = c.trims.map(t=>t.feat[i]||{s:'u'});
  const yes = c.trims.filter((t,j)=>sts[j].s==='y');
  const vals = [...new Set(sts.filter(s=>s.s==='y'&&s.v).map(s=>s.v))];
  if(yes.length===c.trims.length){
    if(vals.length>1) return {s:'y', v: c.trims.map((t,j)=>`${sts[j].v} ${t.name}`).join(' · ')};
    return {s:'y', v: vals[0]||''};
  }
  if(yes.length) return {s:'p', v: yes.map(t=>{ const s=sts[c.trims.indexOf(t)]; return t.name + (s.v?` ${s.v}`:''); }).join(', ') + ' only'};
  if(sts.some(s=>s.s==='n')) return {s:'n'};
  return {s:'u'};
}
const ST_LABEL = {y:'Standard', p:'Some trims', n:'Not available', u:'Not listed in brochure'};
function stChip(st, name){ return `<span class="st ${st.s}" title="${ST_LABEL[st.s]}">${esc(name)}${st.v?` <i>${esc(st.v)}</i>`:''}</span>`; }
function legendHTML(){ return `<div class="legend">${['y','p','n','u'].map(s=>`<span class="st ${s}">${ST_LABEL[s]}</span>`).join('')}</div>`; }
function stCell(st){
  if(!st||st.s==='u') return '<span class="no" title="Not listed in brochure">?</span>';
  if(st.s==='n') return '<span class="no" title="Not available">✗</span>';
  return '<span class="yes">✓</span>' + (st.v?` <span>${esc(st.v)}</span>`:'');
}

/* ---------- cars list ---------- */
let carFilter = 'all';
const FILTERS = [['all','All'],['EV','Electric'],['PHEV','Plug-in hybrid'],['seven','7 seats'],['offroad','Off-road & pickup'],['u2m','Under 2M EGP']];
function passFilter(c,f){
  if(f==='all') return true;
  if(f==='EV'||f==='PHEV') return c.kind===f;
  if(f==='seven') return (c.seats||0)>=7;
  if(f==='offroad') return !!c.offroad;
  if(f==='u2m') return (priceFrom(c)||9e9) < 2000000;
  return true;
}
function renderCars(){
  const list = CARS.filter(c=>passFilter(c,carFilter)).sort((a,b)=>(priceFrom(a)||0)-(priceFrom(b)||0));
  view.innerHTML = `
    <h1 class="pagetitle">Line-up</h1>
    <p class="pagesub">${CARS.length} models, cheapest first. Tap a car for everything about it.</p>
    <div class="chips" role="group" aria-label="Filter cars">${FILTERS.map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${k===carFilter}">${l}</button>`).join('')}</div>
    <a class="finderlink" href="#finder"><div><b>Help me choose</b><div class="small">Budget, electric or hybrid, and what the customer needs</div></div><span class="go">Start</span></a>

/* ---------- car detail ---------- */
const KEYDEFS = [
  ['power','Power','hp'],['torque','Torque','N·m'],['accel','0-100 km/h','s'],
  ['battery','Battery','kWh'],['erange','Electric range','km'],['range','Total range','km'],['fuel','Fuel use','L/100km'],
  ['dc','Max DC charging','kW'],['dctime','DC 30-80%',''],['drive','Drive',''],['seats','Seats',''],
  ['length','Length','mm'],['boot','Boot','L'],['load','Load volume','L'],['towing','Towing','kg'],['clearance','Ground clearance','mm']
];
function renderCar(id){

    const inner = same ? `${esc(vals[0])}${u?`<small>${u}</small>`:''}` :
      c.trims.map((t,i)=>`<span class="split"><b>${esc(vals[i]??'-')}</b> ${esc(t.name)}</span>`).join('');

        ${c.hasBrochure?`<a class="btn red" href="#compare" id="cmpbtn">Compare with another car</a>`:''}

    ${c.pitch&&c.pitch.length?`<section class="panel"><h3>How to explain it</h3><ul class="pitch">${c.pitch.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>${c.bestFor?`<div class="small"><b>Best for:</b> ${esc(c.bestFor)}</div>`:''}</section>`:''}
    ${c.qa&&c.qa.length?`<section class="panel"><h3>Customer questions</h3><div class="qa">${c.qa.map(([q,a])=>`<div><b>“${esc(q)}”</b><span>${esc(a)}</span></div>`).join('')}</div></section>`:''}
    ${diffs.length?`<section class="panel"><h3>What the extra money buys</h3><div style="overflow-x:auto"><table class="diffs"><thead><tr><th>Spec</th>${c.trims.map(t=>`<th>${esc(t.name)}</th>`).join('')}</tr></thead><tbody>${diffs.map(d=>`<tr><td>${esc(d.label)}</td>${c.trims.map(t=>`<td>${cellVal(d.values[t.name])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`:''}

    ${c.paint&&c.paint.length?`<section class="panel"><h3>Colours</h3><div class="small">Paint</div><div class="swatches">${c.paint.map(p=>`<span class="sw">${esc(p)}</span>`).join('')}</div>${c.interior&&c.interior.length?`<div class="small">Interior</div><div class="swatches">${c.interior.map(p=>`<span class="sw">${esc(p)}</span>`).join('')}</div>`:''}</section>`:''}
    ${c.uncertain&&c.uncertain.length?`<div class="note"><b>Check before quoting</b><ul>${c.uncertain.map(u=>`<li>${esc(u)}</li>`).join('')}</ul></div>`:''}

function cellVal(v){
  if(v==null||v===''||v==='-'||v==='–') return '<span class="no">-</span>';
  if(v==='●') return '<span class="yes">✓</span>';
  return esc(v);
}
function trimDiffs(c){
  const out=[];
  c.sections.forEach(s=>s.rows.forEach(r=>{ const vals = c.trims.map(t=>r.values[t.name]??''); if(new Set(vals).size>1) out.push(r); }));
  return out;
}
function featureChecklist(c){
  const groups = Object.entries(DATA.groups).map(([g,title])=>{
    const items = FEATS.map((f,i)=>({f,i,st:carFeat(c,i)})).filter(x=>x.f.g===g && x.st.s!=='u');
    if(!items.length) return '';
    const have = items.filter(x=>x.st.s!=='n').length;
    return `<details class="spec"><summary>${esc(title)}<span class="cnt">${have} of ${items.length}</span></summary><div class="featlist">${items.map(x=>`<div class="fl"><span class="lab">${esc(x.f.n)}</span><span class="val">${x.st.s==='y'?`<span class="yes">✓</span>${x.st.v?' '+esc(x.st.v):''}`:x.st.s==='p'?`<span style="color:var(--hy);font-weight:800">◐</span> ${esc(x.st.v)}`:'<span class="no">✗ Not available</span>'}</span></div>`).join('')}</div></details>`;
  }).join('');
  return `<div class="section-h"><h2>Feature checklist</h2><a class="what" href="#features">All cars ›</a></div><div class="stack">${groups}</div><span class="small">Features this brochure does not mention are left out. The Features tab shows them as "not listed".</span>`;
}
function hlText(text,q){
  const t = esc(text); if(!q) return t;
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if(!terms.length) return t;
  return t.replace(new RegExp('('+terms.join('|')+')','gi'),'<span class="hl">$1</span>');
}
function synonymHit(t,hay){ const syn = DATA.synonyms[t]; return syn ? syn.some(x=>hay.includes(x)) : false; }
function rowMatches(s,r,q){
  if(!q) return true;
  const hay = (s.title+' '+r.label+' '+Object.values(r.values).join(' ')).toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(t=>hay.includes(t)||synonymHit(t,hay));
}
function specsHTML(c,q){
  const multi = c.trims.length>1; let any=false;
  const html = c.sections.map(s=>{
    const rows = s.rows.filter(r=>rowMatches(s,r,q));
    if(!rows.length) return '';
    any=true;
    return `<details class="spec"${q?' open':''}><summary>${esc(s.title)}<span class="cnt">${rows.length}</span></summary><div class="specrows">${rows.map(r=>{
      const vals = c.trims.map(t=>r.values[t.name]);
      const same = vals.every(v=>v===vals[0]);
      const val = (!multi||same) ? cellVal(vals[0]) : c.trims.map((t,i)=>`<span class="tv"><i>${esc(t.name)}</i>${cellVal(vals[i])}</span>`).join('');
      return `<div class="sr"><span class="lab">${hlText(r.label,q)}</span><span class="val">${val}</span></div>`;
    }).join('')}</div></details>`;
  }).join('');
  return any ? html : `<div class="empty">Nothing in this brochure matches “${esc(q)}”.</div>`;
}

/* ---------- compare ---------- */
let cmpSel = null; let cmpDiffOnly = false;
try{ const s = JSON.parse(localStorage.getItem('byd-cmp')||'null'); if(Array.isArray(s)) cmpSel = s; }catch(e){}
const allTrims = () => BCARS.flatMap(c=>c.trims.map(t=>({id:c.id+'|'+t.name, car:c, trim:t, label: shortName(c) + (c.trims.length>1?' '+t.name:'')})));
const CMPROWS = [
  ['g','Price & type'],
  ['price','Price (EGP)','low'],['kindLabel','Powertrain'],['body','Body'],['seats','Seats','high'],
  ['g','Performance'],
  ['power','Power (hp)','high'],['torque','Torque (N·m)','high'],['accel','0-100 km/h (s)','low'],['drive','Drive'],['engine','Engine'],
  ['g','Battery, range & charging'],
  ['battery','Battery (kWh)','high'],['erange','Electric range (km)','high'],['range','Total range (km)','high'],['fuel','Fuel use (L/100km)','low'],['ac','AC charging (kW)','high'],['dc','DC charging (kW)','high'],['dctime','DC 30-80% time','low'],
  ['g','Size & practicality'],
  ['length','Length (mm)'],['width','Width (mm)'],['height','Height (mm)'],['wheelbase','Wheelbase (mm)','high'],['clearance','Ground clearance (mm)','high'],['boot','Boot (L)','high'],['bootmax','Boot, seats down (L)','high'],['load','Pickup load volume (L)'],['weight','Kerb weight (kg)'],['towing','Towing (kg)','high'],['tank','Fuel tank (L)'],['wheels','Wheels'],
  ['g','Screens & comfort'],
  ['screen','Centre screen (in)','high'],['cluster','Driver display (in)','high'],['speakers','Speakers','high'],['airbags','Airbags','high'],
];
function renderCompare(){
  const opts = allTrims();
  if(!cmpSel || !cmpSel.length) cmpSel = [opts[1]?.id, opts[3]?.id].filter(Boolean);
  cmpSel = cmpSel.filter(id=>opts.some(o=>o.id===id));
  const sel = cmpSel.map(id=>opts.find(o=>o.id===id));
  try{ localStorage.setItem('byd-cmp', JSON.stringify(cmpSel)); }catch(e){}
  let body='';
  for(const r of CMPROWS){
    if(r[0]==='g'){ body+=`<tr class="grp"><th colspan="${sel.length+1}">${esc(r[1])}</th></tr>`; continue; }
    const [k,l,dir]=r;
    const vals = sel.map(o=> k==='price'? o.trim.price : (k==='kindLabel'||k==='body') ? o.car[k] : o.trim.key[k]);
    if(vals.every(v=>v==null||v==='')) continue;
    if(cmpDiffOnly && sel.length>1 && vals.every(v=>String(v)===String(vals[0]))) continue;
    const nums = vals.map(v=> v==null? null : parseFloat(String(v).replace(/,/g,'').match(/[\d.]+/)?.[0]));
    let best=null;
    if(dir && sel.length>1){ const valid = nums.filter(n=>n!=null&&!isNaN(n)); if(valid.length>1){ const b = dir==='high'?Math.max(...valid):Math.min(...valid); if(valid.filter(n=>n===b).length<valid.length) best=b; } }
    body+=`<tr><th>${esc(l)}</th>${vals.map((v,i)=>`<td class="${best!=null&&nums[i]===best?'best':''}">${v==null||v===''?'<span class="no">-</span>':esc(k==='price'?fmtEGP(v):v)}</td>`).join('')}</tr>`;
  }
  for(const [g,title] of Object.entries(DATA.groups)){
    let part='';
    FEATS.forEach((f,i)=>{
      if(f.g!==g) return;
      const sts = sel.map(o=>o.trim.feat[i]||{s:'u'});
      if(sts.every(s=>s.s==='u')) return;
      const key = s => s.s + '|' + (s.v||'');
      if(cmpDiffOnly && sel.length>1 && sts.every(s=>key(s)===key(sts[0]))) return;
      part+=`<tr><th>${esc(f.n)}</th>${sts.map(s=>`<td>${stCell(s)}</td>`).join('')}</tr>`;
    });
    if(part) body+=`<tr class="grp"><th colspan="${sel.length+1}">${esc(title)}</th></tr>`+part;
  }
  view.innerHTML = `
    <h1 class="pagetitle">Compare</h1>
    <p class="pagesub">Pick up to 3 cars or trims.</p>
    <div class="picker">${opts.map(o=>`<button class="chip" data-id="${esc(o.id)}" aria-pressed="${cmpSel.includes(o.id)}">${esc(o.label)}</button>`).join('')}</div>
    <label class="toggle"><input type="checkbox" class="switch" id="diffonly" ${cmpDiffOnly?'checked':''}> Show only differences</label>
    ${sel.length?`<div class="cmpwrap"><table class="cmp"><thead><tr><th></th>${sel.map(o=>`<th>${img(o.car)}${esc(o.label)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>
    <span class="small">▲ marks the best number in a row. ✓ standard, ✗ marked not available, ? not listed in that car's brochure (check before quoting).</span>`:'<div class="empty">Pick a car above to start.</div>'}
  `;
  view.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.id;
    if(cmpSel.includes(id)) cmpSel=cmpSel.filter(x=>x!==id);
    else { cmpSel.push(id); if(cmpSel.length>3) cmpSel.shift(); }
    draw(renderCompare, false);
  });
  $('#diffonly').onchange=e=>{cmpDiffOnly=e.target.checked; draw(renderCompare, false);};
}

  ['ac','AC (home) charging','kW','high',''],

let rMetric = 'erange';
const toNum = v => { if(v==null) return null; const m = String(v).replace(/,/g,'').match(/[\d.]+/); return m ? parseFloat(m[0]) : null; };
function renderRankings(){
  const [k,label,unit,dir,note] = METRICS.find(x=>x[0]===rMetric);
  const entries = CARS.flatMap(c=>c.trims.map(t=>({c,t,v: k==='price'? t.price : t.key[k]}))).map(e=>({...e,n:toNum(e.v)})).filter(e=>e.n!=null);
  entries.sort((a,b)=> dir==='high' ? b.n-a.n : a.n-b.n);
  const max = Math.max(...entries.map(e=>e.n));
  const missing = BCARS.filter(c=>!entries.some(e=>e.c===c)).map(shortName);
  view.innerHTML = `
    <h1 class="pagetitle">Rankings</h1>
    <p class="pagesub">The whole line-up, ordered by one spec.</p>
    <div class="chips" role="group" aria-label="Rank by">${METRICS.map(x=>`<button class="chip" data-k="${x[0]}" aria-pressed="${x[0]===rMetric}">${esc(x[1])}</button>`).join('')}</div>
    <section class="panel"><div class="section-h" style="margin:0"><h3>${esc(label)}${unit?` <span class="small">(${esc(unit)})</span>`:''}</h3><span class="small">${dir==='high'?'Highest':'Lowest'} first</span></div>
      <div class="bars">${entries.map((e,i)=>{
        const rank = i>0 && e.n===entries[i-1].n ? '=' : i+1;
        return `<a class="bar ${e.c.kind==='EV'?'ev':'hy'}" href="#car-${e.c.id}"><span class="rk">${rank}</span>${img(e.c)}<div class="bd"><div class="top"><span>${esc(shortName(e.c))}${e.c.trims.length>1?` <span class="small">${esc(e.t.name)}</span>`:''}</span><b>${esc(k==='price'?fmtEGP(e.v):e.v)}</b></div><div class="track"><div class="fill" style="width:${Math.max(3,e.n/max*100).toFixed(1)}%;animation-delay:${Math.min(i*40,400)}ms"></div></div></div></a>`;
      }).join('')}</div>
      ${note?`<span class="small">${esc(note)}</span>`:''}
      ${missing.length?`<span class="small">Not in the brochure for: ${esc(missing.join(', '))}.</span>`:''}
    </section>
    <div class="legend"><span class="kind ev">Electric</span><span class="kind hy">Plug-in hybrid</span></div>`;
  view.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{rMetric=b.dataset.k; draw(renderRankings, false);});
}

/* ---------- tech ---------- */
function renderLearn(focus){
  view.innerHTML = `
    <h1 class="pagetitle">BYD tech</h1>
    <p class="pagesub">Explained simply, with a line to say to customers.</p>
    <div class="chips">${DATA.glossary.map(g=>`<a class="chip" href="#tech-${esc(g.id)}">${esc(g.term.split(/ [-(]/)[0])}</a>`).join('')}</div>
    <div class="gl">${DATA.glossary.map(g=>`<section class="panel" id="g-${esc(g.id)}"><h3>${esc(g.term)}</h3><p>${esc(g.text)}</p>${g.say?`<p class="say"><b>Say it like this:</b> ${esc(g.say)}</p>`:''}${g.cars?`<span class="small">${esc(g.cars)}</span>`:''}</section>`).join('')}</div>`;
  const el = focus && document.getElementById('g-'+focus);
  if(el){ requestAnimationFrame(()=>{ const top = el.getBoundingClientRect().top + window.scrollY - (document.querySelector('header.top').offsetHeight + 16); window.scrollTo({top, behavior:'smooth'}); el.classList.add('focus'); }); }
}

/* ---------- global search ---------- */
function renderSearch(q){
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const groups = [];
  const carHits = CARS.filter(c=>terms.every(t=>(c.name+' '+c.kindLabel+' '+c.body+' '+c.tagline).toLowerCase().includes(t)));
  for(const c of CARS){
    const hits=[];
    c.sections.forEach(s=>s.rows.forEach(r=>{ if(rowMatches(s,r,q)) hits.push({s,r}); }));
    (c.pitch||[]).forEach(p=>{ const h=p.toLowerCase(); if(terms.every(t=>h.includes(t)||synonymHit(t,h))) hits.push({pitch:p}); });
    if(hits.length) groups.push({c,hits});
  }
  const glHits = DATA.glossary.filter(g=>terms.every(t=>(g.term+' '+g.text).toLowerCase().includes(t)||synonymHit(t,(g.term+' '+g.text).toLowerCase())));
  const fHits = FEATS.map((f,i)=>({f,i})).filter(({f})=>{ const h=(f.n+' '+f.tip+' '+DATA.groups[f.g]).toLowerCase(); return terms.every(t=>h.includes(t)||synonymHit(t,h)); }).filter(({i})=>BCARS.some(c=>carFeat(c,i).s!=='u'));
  const total = carHits.length + groups.reduce((a,g)=>a+g.hits.length,0) + glHits.length + fHits.length;
  view.innerHTML = `
    <div class="section-h"><h2>Results</h2><span class="small">${total} for “${esc(q)}”</span></div>
    ${carHits.length?`<div class="cars">${carHits.map(cardHTML).join('')}</div>`:''}
    ${fHits.length?`<div class="grouphead"><h3>Which cars have it</h3></div>${fHits.slice(0,6).map(({f,i})=>`<section class="fcard"><div class="fh"><h3>${hlText(f.n,q)}</h3>${f.gl?`<a class="what" href="#tech-${f.gl}">What is it?</a>`:''}</div><div class="sts">${BCARS.map(c=>({c,st:carFeat(c,i)})).sort((a,b)=>'ypnu'.indexOf(a.st.s)-'ypnu'.indexOf(b.st.s)).map(x=>stChip(x.st,shortName(x.c))).join('')}</div></section>`).join('')}`:''}
    ${glHits.length?`<div class="grouphead"><h3>BYD tech</h3></div><div class="results">${glHits.map(g=>`<a class="res" href="#tech-${esc(g.id)}"><span class="where">Explained</span><span class="what"><span>${hlText(g.term,q)}</span></span><span class="small">${esc(g.text.slice(0,140))}…</span></a>`).join('')}</div>`:''}
    ${groups.map(g=>`<div class="grouphead"><h3>${esc(g.c.name)}</h3>${kindChip(g.c)}</div><div class="results">${g.hits.slice(0,30).map(h=> h.pitch ? `<a class="res" href="#car-${g.c.id}"><span class="where">Talking point</span><span>${hlText(h.pitch,q)}</span></a>` : `<a class="res" href="#car-${g.c.id}"><span class="where">${esc(h.s.title)}</span><span class="what"><span>${hlText(h.r.label,q)}</span><span class="val">${g.c.trims.length>1 && new Set(g.c.trims.map(t=>h.r.values[t.name])).size>1 ? g.c.trims.map(t=>esc(t.name)+': '+cellVal(h.r.values[t.name])).join('<br>') : cellVal(h.r.values[g.c.trims[0].name])}</span></span></a>`).join('')}${g.hits.length>30?`<span class="small">+${g.hits.length-30} more in this car</span>`:''}</div>`).join('')}
    ${!total?`<div class="empty">No match for “${esc(q)}”. Try a simpler word like "camera", "range", "seats" or "charging".</div>`:''}`;
}

/* ---------- routing ---------- */
function draw(fn, animate=true){ main.classList.toggle('anim', animate); fn(); }
const q = $('#q'), qclear = $('#qclear');
function route(){
  const h = location.hash.replace('#','') || 'cars';
  const tab = h.startsWith('car-') || h==='finder' ? 'cars' : h.startsWith('tech') ? 'tech' : h;
  document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current', a.dataset.tab===tab ? 'page' : 'false'));
  if(q.value.trim()){ q.value=''; qclear.hidden=true; }
  if(!h.startsWith('tech-')) window.scrollTo(0,0);
  if(h.startsWith('car-')) draw(()=>renderCar(h.slice(4)));
  else if(h==='compare') draw(renderCompare);
  else if(h==='finder') draw(renderFinder);
  else if(h==='features') draw(renderFeatures);
  else if(h==='rankings') draw(renderRankings);
  else if(h.startsWith('tech')) draw(()=>renderLearn(h.slice(5)));
  else draw(renderCars);
}
q.addEventListener('input',()=>{
  const v=q.value.trim(); qclear.hidden=!v;
  if(v.length>=2){ window.scrollTo(0,0); draw(()=>renderSearch(v), false); } else if(!v) route();
});
qclear.onclick=()=>{ q.value=''; qclear.hidden=true; route(); q.focus(); };
window.addEventListener('hashchange', route);
route();

/* offline: cache the app on the phone */
if('serviceWorker' in navigator && location.protocol==='https:'){ addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
})();
</script>
