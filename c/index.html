<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BYD Egypt</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Showroom guide to the BYD Egypt line-up: prices, specs, comparisons and features.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0C0E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BYD Guide">
<meta property="og:title" content="BYD Egypt line-up"><meta property="og:description" content="Specifications, features and prices, shared by your BYD advisor."><meta property="og:image" content="https://ahmedkhaledakm.github.io/byd-guide/icon-512.png"><meta name="robots" content="noindex">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&family=Cairo:wght@400;600;700;800&display=swap">
<style>
/* Layout: phone app. Compact sticky app bar with the BYD mark, big page title, floating pill tab bar.
   Palette: BYD red on clean white and graphite. Blue marks electric, amber marks plug-in hybrid. */
:root{
  --bg:#F2F3F5; --card:#FFFFFF; --card-2:#F6F7F9; --field:#ECEEF1;
  --ink:#0F1114; --ink-2:#4A4F57; --ink-3:#868C95; --line:rgba(15,17,20,.08);
  --red:#E51F2A; --red-ink:#FFFFFF; --red-soft:#FDE9EA; --red-text:#C8141F;
  --ev:#1766D6; --ev-soft:#E5EEFB; --hy:#B25F0C; --hy-soft:#FAEEDF;
  --yes:#1B8F4A; --yes-soft:#E3F4EA; --warn:#8F5A00; --warn-soft:#FFF3D9;
  --bar:rgba(255,255,255,.86); --shadow:0 1px 2px rgba(15,17,20,.05),0 6px 20px rgba(15,17,20,.06);
  --f-display:"Montserrat", "Cairo", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Cairo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:22px; --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0C0E; --card:#16181B; --card-2:#1C1F23; --field:#202328;
  --ink:#F3F4F6; --ink-2:#B4B9C1; --ink-3:#7E848D; --line:rgba(255,255,255,.08);
  --red:#FF3B45; --red-ink:#FFFFFF; --red-soft:rgba(255,59,69,.16); --red-text:#FF6B73;
  --ev:#6AA8FF; --ev-soft:rgba(106,168,255,.15); --hy:#F2A94E; --hy-soft:rgba(242,169,78,.15);
  --yes:#4FD483; --yes-soft:rgba(79,212,131,.14); --warn:#F2BE55; --warn-soft:rgba(242,190,85,.13);
  --bar:rgba(26,28,32,.86); --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B0C0E; --card:#16181B; --card-2:#1C1F23; --field:#202328;
  --ink:#F3F4F6; --ink-2:#B4B9C1; --ink-3:#7E848D; --line:rgba(255,255,255,.08);
  --red:#FF3B45; --red-ink:#FFFFFF; --red-soft:rgba(255,59,69,.16); --red-text:#FF6B73;
  --ev:#6AA8FF; --ev-soft:rgba(106,168,255,.15); --hy:#F2A94E; --hy-soft:rgba(242,169,78,.15);
  --yes:#4FD483; --yes-soft:rgba(79,212,131,.14); --warn:#F2BE55; --warn-soft:rgba(242,190,85,.13);
  --bar:rgba(26,28,32,.86); --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.12;letter-spacing:-.01em}
.small{font-size:13px;color:var(--ink-3)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:8px}
.mark{display:block;height:13px;width:auto}
.mark path{fill:none;stroke:var(--red);stroke-width:7}

/* splash: the logo draws itself, then the app fades in */
#splash{position:fixed;inset:0;z-index:100;background:var(--card);display:grid;place-items:center;transition:opacity .45s var(--ease),visibility .45s}
#splash svg{width:min(56vw,260px);height:auto;overflow:visible}
#splash path{fill:none;stroke:var(--red);stroke-width:7;stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1s var(--ease) forwards}
#splash path:nth-child(2){animation-delay:.08s}#splash path:nth-child(3){animation-delay:.16s}#splash path:nth-child(4){animation-delay:.22s}#splash path:nth-child(5){animation-delay:.28s}#splash path:nth-child(6){animation-delay:.34s}
#splash .sub{position:absolute;bottom:calc(48px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font:600 13px var(--f-display);letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3);opacity:0;animation:fade .5s .6s forwards}
#splash.out{opacity:0;visibility:hidden}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}

/* app bar */
header.top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px)}
header.top .wrap{padding-block:10px 10px;display:flex;flex-direction:column;gap:10px}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand .mark{height:14px}
.brand span{font:700 12.5px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
@media (max-width:350px){.datepill{display:none}}
.datepill{font:600 12px var(--f-body);color:var(--ink-2);background:var(--card);border-radius:999px;padding:5px 10px;box-shadow:var(--shadow);white-space:nowrap}
.searchbox{position:relative}
.searchbox input{width:100%;font:inherit;font-size:16px;padding:12px 44px 12px 44px;border-radius:999px;border:0;background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.searchbox input::placeholder{color:var(--ink-3)}
.searchbox svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:2.2}
.searchbox .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--field);border-radius:999px;width:28px;height:28px;color:var(--ink-2);cursor:pointer;font-size:16px;line-height:1}

/* floating pill tab bar: active tab grows to show its name */
nav.tabs{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;justify-content:center;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
nav.tabs .pill{pointer-events:auto;display:flex;gap:2px;padding:6px;border-radius:999px;background:var(--bar);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);box-shadow:0 10px 30px rgba(0,0,0,.14),0 0 0 1px var(--line);max-width:100%}
nav.tabs a{display:flex;align-items:center;gap:5px;height:44px;padding:0 10px;border-radius:999px;text-decoration:none;color:var(--ink-2);font:700 13.5px var(--f-display);white-space:nowrap;transition:background .3s var(--ease),color .3s var(--ease),padding .3s var(--ease)}
nav.tabs a svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav.tabs a span{max-width:0;overflow:hidden;opacity:0;transition:max-width .35s var(--ease),opacity .25s}
nav.tabs a[aria-current="page"]{background:var(--red);color:var(--red-ink);padding:0 13px 0 10px}
@media (max-width:380px){nav.tabs a{padding:0 8px}nav.tabs a[aria-current="page"]{padding:0 11px 0 8px}nav.tabs a svg{width:21px;height:21px}nav.tabs .pill{padding:5px}}
nav.tabs a[aria-current="page"] span{max-width:100px;opacity:1}

main{padding-top:var(--hdr,122px)}
main .wrap{padding-block:6px 24px;display:flex;flex-direction:column;gap:16px}
main.anim .wrap > *{animation:rise .45s var(--ease) both}
main.anim .wrap > *:nth-child(2){animation-delay:.03s} main.anim .wrap > *:nth-child(3){animation-delay:.06s} main.anim .wrap > *:nth-child(4){animation-delay:.09s} main.anim .wrap > *:nth-child(n+5){animation-delay:.12s}
.pagetitle{font-size:32px;font-weight:800;letter-spacing:-.02em;padding-top:4px}
.pagesub{color:var(--ink-2);margin-top:-8px;font-size:15px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px}
.section-h h2{font-size:21px;font-weight:800}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--card);border-radius:999px;padding:8px 14px;font:600 14px var(--f-body);cursor:pointer;color:var(--ink-2);box-shadow:var(--shadow);text-decoration:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.kind{display:inline-flex;align-items:center;gap:6px;font:700 11.5px var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:999px}
.kind.ev{background:var(--ev-soft);color:var(--ev)}
.kind.hy{background:var(--hy-soft);color:var(--hy)}
.kind::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.onimg .kind{background:rgba(255,255,255,.88);backdrop-filter:blur(8px)}
.onimg .kind.ev{color:#1766D6}.onimg .kind.hy{color:#B25F0C}

/* car list */
.cars{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:640px){.cars{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;min-width:0;box-shadow:var(--shadow);transition:transform .25s var(--ease)}
.card:active{transform:scale(.985)}
.card .ph{position:relative;aspect-ratio:16/9;background:var(--field);overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .ph .onimg{position:absolute;left:12px;top:12px}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.card .row1{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.card h3{font-size:21px;font-weight:800}
.card .type{color:var(--ink-3);font-size:13.5px}
.price{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.price small{font-size:.62em;color:var(--ink-3);font-weight:700;margin-right:3px;letter-spacing:.04em}
.card .price{font-size:17px;text-align:right}
.card .from{font-size:11.5px;color:var(--ink-3);text-align:right;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--card-2);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:15.5px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap;letter-spacing:-.02em}
.stats{row-gap:10px}
.stat span{font-size:12px;color:var(--ink-3)}
.card .tag{font-size:14.5px;color:var(--ink-2)}
.nobrochure{font-size:13.5px;color:var(--warn);background:var(--warn-soft);border-radius:12px;padding:8px 12px}

/* car sheet */
.back{display:inline-flex;align-items:center;gap:4px;color:var(--red-text);text-decoration:none;font-weight:700;font-size:15px;align-self:flex-start}
.hero{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.hero .ph{position:relative;aspect-ratio:16/10;background:var(--field)}
.hero .ph img{width:100%;height:100%;object-fit:cover}
.hero .ph::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(to top,rgba(0,0,0,.66),transparent)}
.hero .ph .cap{position:absolute;left:16px;right:16px;bottom:14px;z-index:1;color:#fff;display:flex;flex-direction:column;gap:6px}
.hero .ph h2{font-size:32px;font-weight:800;letter-spacing:-.02em;color:#fff}
.hero .ph .onimg{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hero .ph .typ{font-size:13.5px;color:rgba(255,255,255,.88)}
.hero .in{padding:16px;display:flex;flex-direction:column;gap:12px}
.hero .tagline{color:var(--ink-2);font-size:16px}
.trimprices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.trimprice{background:var(--card-2);border-radius:14px;padding:10px 12px}
.trimprice .t{font-size:13px;color:var(--ink-3);font-weight:600}
.trimprice .price{font-size:19px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:11px 18px;font:700 14.5px var(--f-display);cursor:pointer;text-decoration:none}
.btn.red{background:var(--red);color:var(--red-ink)}
.btn.soft{background:var(--card-2);color:var(--ink)}
.keygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.keygrid{grid-template-columns:repeat(3,1fr)}}
.kg{background:var(--card);border-radius:18px;padding:12px 14px;min-width:0;box-shadow:var(--shadow)}
.kg .v{font-family:var(--f-display);font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.01em}
.kg .v small{font-size:12.5px;font-weight:700;color:var(--ink-3);margin-left:3px}
.kg .l{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.kg .split{display:block;font-size:13.5px;color:var(--ink-2);font-family:var(--f-body);font-weight:500}
.kg .split b{font-family:var(--f-display);font-weight:800;color:var(--ink);font-size:16px}
.panel{background:var(--card);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.panel h3{font-size:18px;font-weight:800}
.pitch{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px}
.pitch li{padding-left:18px;position:relative}
.pitch li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:3px;border-radius:2px;background:var(--red)}
.qa{display:flex;flex-direction:column;gap:14px}
.qa div{background:var(--card-2);border-radius:14px;padding:12px 14px}
.qa b{display:block;font-weight:700;margin-bottom:2px}
.qa span{color:var(--ink-2)}
.diffs{width:100%;border-collapse:collapse;font-size:14.5px}
.diffs th,.diffs td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.diffs th{font:700 11.5px var(--f-display);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.yes{color:var(--yes);font-weight:800}
.no{color:var(--ink-3)}
details.spec{background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
details.spec summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;font:700 15.5px var(--f-display)}
details.spec summary::-webkit-details-marker{display:none}
details.spec summary .cnt{margin-left:auto;color:var(--ink-3);font:600 13px var(--f-body)}
details.spec summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg) translateY(-3px);transition:transform .25s var(--ease);flex:none}
details.spec[open] summary::after{transform:rotate(225deg) translateY(-1px)}
.stack{display:flex;flex-direction:column;gap:8px}
.specrows{padding:0 16px 10px;display:flex;flex-direction:column}
.sr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.sr .lab{color:var(--ink-2);min-width:0}
.sr .val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;max-width:55vw}
.sr .val .tv{display:block}
.sr .val .tv i{font-style:normal;color:var(--ink-3);font-weight:500;font-size:12.5px;margin-right:4px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{background:var(--card-2);border-radius:999px;padding:5px 12px;font-size:14px}
.note{background:var(--warn-soft);color:var(--ink);border-radius:18px;padding:14px 16px;font-size:14.5px;display:flex;flex-direction:column;gap:6px}
.note b{color:var(--warn);font-family:var(--f-display)}
.note ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.hl{background:var(--red-soft);color:var(--ink);border-radius:4px;padding:0 2px}
.insearch input{background:var(--card-2);box-shadow:none}

/* compare */
.picker{display:flex;flex-wrap:wrap;gap:8px}
.cmpwrap{overflow-x:auto;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}
table.cmp{border-collapse:collapse;width:100%;font-size:14.5px}
table.cmp th,table.cmp td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.cmp thead th{background:var(--card);font:800 14px var(--f-display);min-width:116px;vertical-align:bottom}
table.cmp thead th img{width:100%;max-width:150px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin-bottom:6px}
table.cmp tbody th{font-weight:600;color:var(--ink-2);font-size:13.5px;min-width:118px;position:sticky;left:0;background:var(--card);z-index:1}
table.cmp td{font-variant-numeric:tabular-nums;font-weight:700}
table.cmp td.best{color:var(--red-text)}
table.cmp td.best::after{content:" ▲";font-size:9px;vertical-align:2px}
table.cmp tr.grp th{background:var(--card-2);font:700 11.5px var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);position:static}
.toggle{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink-2);cursor:pointer}
.switch{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--field);position:relative;cursor:pointer;transition:background .25s;flex:none;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s var(--ease)}
.switch:checked{background:var(--red)}
.switch:checked::after{transform:translateX(18px)}

/* search */
.results{display:flex;flex-direction:column;gap:8px}
.res{background:var(--card);border-radius:16px;padding:11px 14px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:inherit;box-shadow:var(--shadow)}
.res .where{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.03em}
.res .what{display:flex;justify-content:space-between;gap:10px}
.res .what .val{font-weight:700;text-align:right}
.grouphead{display:flex;align-items:center;gap:8px;margin-top:6px}
.grouphead h3{font-size:16px;font-weight:800}
.empty{color:var(--ink-3);text-align:center;padding:30px 10px}

/* learn */
.gl{display:flex;flex-direction:column;gap:12px}
.gl .panel p{margin:0;color:var(--ink-2)}
.gl .panel .say{color:var(--ink);background:var(--red-soft);border-radius:14px;padding:11px 13px}
.gl .panel.focus{box-shadow:0 0 0 2px var(--red),var(--shadow)}
.included{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.included li{display:flex;gap:10px;align-items:flex-start}
.included li::before{content:"✓";color:var(--yes);font-weight:800}
.finder{display:flex;flex-direction:column;gap:12px}
.finder label{font:700 13px var(--f-display);color:var(--ink-2);display:block;margin-bottom:4px}
.finder select{font:inherit;padding:11px 12px;border-radius:14px;border:0;background:var(--card-2);color:var(--ink);width:100%}
.finderlink{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:14px 16px;text-decoration:none}

ss Traffic Alert","التنبيه من حركة المرور العرضية الخلفية"],["FCW","Front Collision Warning","التحذير من الاصطدام الأمامي"],["AEB","Autonomous Emergency Braking","الفرملة الذاتية في حالات الطوارئ"],["HMA","High Beam Assist","مساعد الأضواء العالية"],["DFM","Driver Fatigue Monitoring","مراقبة إرهاق السائق"],["ESP","Electronic Stability Program","برنامج الثبات الإلكتروني"],["TCS","Traction Control System","نظام التحكم في الجر"],["EBD","Electronic Brake-force Distribution","التوزيع الإلكتروني لقوة الفرامل"],["EPB","Electric Parking Brake","فرامل اليد الكهربائية"],["HDC","Hill Descent Control","التحكم في النزول من المنحدرات"],["HHC","Hill Hold Control","مساعد الثبات على المنحدرات"],["IPB","Intelligent Power Brake","نظام الفرملة الذكي"],["CST","Comfort Stop","التوقف المريح"],["TPMS","Tyre Pressure Monitoring System","نظام مراقبة ضغط الإطارات"],["ISOFIX","International Standard child-seat Fixing","نظام تثبيت مقاعد الأطفال الدولي"],["HUD","Head-Up Display","شاشة العرض على الزجاج الأمامي"],["NFC","Near Field Communication","الاتصال قريب المدى"],["LED","Light-Emitting Diode","صمام ثنائي باعث للضوء"],["LCD","Liquid Crystal Display","شاشة الكريستال السائل"],["TFT","Thin-Film Transistor","شاشة الترانزستور الرقيق"],["USB","Universal Serial Bus","منفذ USB العالمي"],["4G","Fourth-Generation mobile network","شبكة الجيل الرابع"],["PM2.5","Fine dust particles under 2.5 microns","جزيئات الغبار الدقيقة أقل من 2.5 ميكرون"],["FWD","Front-Wheel Drive","دفع بالعجلات الأمامية"],["AWD","All-Wheel Drive","دفع بجميع العجلات"],["RWD","Rear-Wheel Drive","دفع بالعجلات الخلفية"],["SUV","Sport Utility Vehicle","سيارة رياضية متعددة الاستخدامات"],["MPV","Multi-Purpose Vehicle","سيارة عائلية متعددة الأغراض"],["EHS","Electric Hybrid System","النظام الهجين الكهربائي"],["A/C","Air Conditioning","تكييف الهواء"],["AC","Alternating Current","تيار متردد"],["DC","Direct Current","تيار مستمر"],["CC","Cruise Control","مثبت السرعة"]],"built":"11 Nov 2026, 01:02","priceDate":"22 Oct 2026","included":["V2L charging unit (power appliances from the car)","Original BYD home charger","Portable charging cable","Roadside assistance for 6 years, unlimited trips, free of charge","8 years / 200,000 km battery warranty"],"synonyms":{"trunk":["boot"],"luggage":["boot"],"camera":["camera","360"],"sunroof":["panoramic","sunroof"],"roof":["panoramic","roof"],"cooled":["ventilat"],"cooling":["ventilat"],"ac":["a/c","climate"],"aircon":["a/c","climate"],"screen":["touchscreen","display","instrument"],"speed":["0-100","power"],"acceleration":["0-100"],"hp":["power"],"horsepower":["power"],"fuel":["consumption","fuel"],"fast":["dc"],"cruise":["cruise"],"fridge":["refrigerator"],"tow":["tow"],"parking":["radar","parking"],"sensors":["radar","sensor"],"phone":["wireless","carplay","android"],"key":["key","nfc"],"warranty":["warranty"],"seats":["seat"],"awd":["awd","4wd","all-wheel"],"4x4":["awd","4wd","4x4"]},"glossary":[{"id":"blade","term":"BYD Blade Battery (LFP)","cars":"In every car in the line-up.","text":"BYD makes its own batteries. The Blade Battery uses long, thin cells shaped like blades and packed tightly together. The chemistry is LFP (lithium iron phosphate), which is very stable, resists overheating and lasts many charge cycles. BYD is known for its nail penetration test, where a nail is driven through a cell without causing fire or smoke.","say":"The battery is built by BYD itself and uses the safest common battery chemistry. That is why BYD backs it with 8 years or 200,000 km of warranty."},{"id":"dmi","term":"DM-i Super Plug-in Hybrid","cars":"Sealion 5 DM-i, Sealion 6 DM-i, Atto 8 DM-i, Ti7, M9 DM-i.","text":"DM-i cars mostly drive on their electric motor. The petrol engine (a 1.5 L in our line-up) mainly works as a generator and drives the wheels directly at higher speeds, when that is more efficient. You plug in at home for electric-only daily driving, and on long trips you just fill up with petrol, with no charging needed.","say":"Think of it as an electric car with its own petrol power station on board: electric for daily use, no range worry on trips."},{"id":"dmo","term":"DM-O (Dual Mode Off-Road)","cars":"Shark 6 DMO.","text":"This is BYD’s plug-in hybrid system for off-road use. On the Shark 6 it is \"DM-O AWD\": a 1.5 T engine with electric drive to all four wheels, a 29.6 kWh Blade Battery, double wishbone suspension front and rear, and Sand, Mud and Mount driving modes.","say":"It is the same smart hybrid idea, built for a 4x4: strong electric torque on all wheels, with petrol for long distances."},{"id":"evphev","term":"EV vs plug-in hybrid","text":"An EV (Dolphin Surf, Atto 2, Sealion 6 EV) runs only on its battery: no fuel, no oil changes, lowest running cost, but you need to charge. A plug-in hybrid (DM-i, DM-O) has a smaller battery for daily electric driving plus a petrol engine, so it never strands you.","say":"If you can charge at home and mostly drive in the city, go EV. If you travel a lot or cannot always charge, go plug-in hybrid."},{"id":"kw","term":"kW vs kWh","text":"kWh is how much energy the battery holds, like the size of a fuel tank. kW is how fast power flows, like how fast the pump fills the tank. Charging power is in kW.","say":"kWh is the size of the tank. kW is the speed of the pump."},{"id":"acdc","term":"AC vs DC charging","text":"AC is home or slow charging through the car’s on-board charger (6.6-11 kW in our line-up). DC is fast charging at public stations, which goes straight into the battery (40 kW up to 155 kW in our line-up). DC times are quoted from 30% to 80% because charging slows down near full to protect the battery.","say":"Home charging overnight covers daily use. DC fast charging is for road trips: think coffee-break length."},{"id":"ports","term":"CCS2 and Type 2","text":"These are the plug standards. CCS2 handles both AC and DC fast charging, and is the common standard in Egypt and Europe. Type 2 is the AC plug (the Sealion 5 uses Type 2)."},{"id":"wltp","term":"WLTP range","text":"WLTP is the official European lab test for range and fuel use. It is a fair way to compare cars, but real range changes with speed, A/C use, heat, load and driving style. Fast highway driving and heavy A/C lower the range.","say":"WLTP is the official figure for comparing cars. Real range depends on how and where you drive."},{"id":"v2l","term":"V2L (Vehicle-to-Load)","cars":"Every model. The V2L unit is included with every BYD.","text":"V2L lets the car’s battery power ordinary electric devices through an adapter: a coffee machine at a picnic, a laptop, lights at a camp, or tools at a work site.","say":"Your car becomes a big power bank on wheels: plug in a kettle at the beach."},{"id":"ctc","term":"CTC (Cell to Chassis)","cars":"Used in the Shark 6.","text":"The battery cells are built into the car’s structure instead of sitting in a separate box. This saves space and weight and makes the body stiffer."},{"id":"warranty","term":"Warranty and what is included","text":"Every BYD comes with an 8-year / 200,000 km battery warranty, 6 years of free roadside assistance with unlimited trips, a V2L unit, an original BYD home charger and a portable charging cable with every BYD. Terms and conditions apply."},{"id":"acc","term":"ACC - Adaptive Cruise Control","text":"Keeps a set speed and automatically keeps a safe distance from the car ahead, slowing down and speeding up with traffic."},{"id":"cc","term":"CC - Cruise Control","text":"Basic cruise control. It holds a set speed, but does not react to the car in front. ACC is the smarter version."},{"id":"lka","term":"LKA / LDW - Lane Keep Assist / Lane Departure Warning","text":"LDW warns you when the car drifts out of its lane without signalling. LKA goes further and gently steers the car back into the lane."},{"id":"bsd","term":"BSD - Blind Spot Detection","text":"Warns you, usually with a light in the mirror, when a car is in your blind spot as you change lanes."},{"id":"cta","term":"FCTA / RCTA - Front / Rear Cross Traffic Alert","text":"Warns of cars crossing in front of or behind you when you pull out of a parking spot or a blind junction."},{"id":"fcw","term":"FCW - Front Collision Warning","text":"Warns the driver when the car is closing in too fast on the vehicle ahead."},{"id":"hma","term":"HMA - High Beam Assist","text":"Switches between high and low beam automatically, so you do not dazzle oncoming drivers."},{"id":"dms","term":"Driver monitoring and fatigue detection","text":"A camera watches for signs that the driver is tired or distracted and gives a warning. On the Atto 8 and the M9 Luxury."},{"id":"esp","term":"ESP, TCS, EBD - stability and brakes","text":"ESP keeps the car stable in a skid or sharp turn. TCS stops the wheels spinning on slippery ground. EBD shares braking force between the wheels for shorter, straighter stops."},{"id":"ipb","term":"IPB, EPB, Auto Hold, CST","text":"IPB is BYD’s integrated electronic brake system. EPB is an electric handbrake button. Auto Hold keeps the car still at a red light without your foot on the brake. CST (Comfort Stop) smooths the last moment of braking so the car does not jerk."},{"id":"hdc","term":"HDC / HHC - Hill Descent / Hill Hold Control","text":"HDC holds a slow, steady speed down steep slopes (sand dunes, ramps). HHC stops the car rolling back when you pull away on a hill."},{"id":"tpms","term":"TPMS","text":"Tyre Pressure Monitoring System. It warns you when a tyre is losing air."},{"id":"isofix","term":"ISOFIX","text":"Standard metal anchor points for fixing child seats firmly to the car."},{"id":"hud","term":"HUD - Head-up display","text":"Projects speed and navigation onto the windscreen in front of the driver, so their eyes stay on the road. A 26\" HUD means the projected image looks like a 26-inch screen."},{"id":"nfc","term":"NFC card key / smart key","text":"Lock, unlock and start the car with a card or a phone tapped on the mirror area, as well as the normal smart key."},{"id":"awd","term":"FWD, AWD","text":"FWD means the front wheels drive the car: efficient, with more electric range. AWD means all four wheels drive it: more power, more grip on sand and wet roads, quicker acceleration. On the Ti7, the AWD version has 485 hp against 275 hp for the FWD."},{"id":"suspension","term":"Suspension types","text":"MacPherson and torsion beam are simple, light and compact (city cars). Multi-link and double wishbone keep the tyres flatter on the road for better comfort and grip (bigger SUVs and the Shark). The Ti7 AWD’s Intelligent Damping System adjusts stiffness automatically."},{"id":"turning","term":"Turning circle","text":"How much space the car needs to make a U-turn. Most models quote 4.95-5.9 m, which is the turning radius. The Shark 6 quotes 13.5 m, which is the full circle, so its figure is not directly comparable."}],"groups":{"adas":"Driver assist (ADAS)","park":"Parking & cameras","safe":"Safety","comfort":"Comfort & seats","tech":"Screens & tech","energy":"Charging & energy","off":"Off-road & utility"},"features":[{"g":"adas","n":"Adaptive cruise control (ACC)","tip":"Keeps speed and distance to the car ahead automatically.","gl":"acc"},{"g":"adas","n":"Basic cruise control","tip":"Holds a set speed only.","gl":"cc"},{"g":"adas","n":"Lane keep assist (LKA)","tip":"Steers gently back into the lane.","gl":"lka"},{"g":"adas","n":"Lane departure warning (LDW)","tip":"Warns when drifting out of lane.","gl":"lka"},{"g":"adas","n":"Blind spot detection (BSD)","tip":"Warns of cars in the blind spot.","gl":"bsd"},{"g":"adas","n":"Front cross traffic alert (FCTA)","tip":"Warns of crossing traffic ahead at junctions.","gl":"cta"},{"g":"adas","n":"Rear cross traffic alert (RCTA)","tip":"Warns of crossing traffic when reversing out.","gl":"cta"},{"g":"adas","n":"Front collision warning (FCW)","tip":"Warns when closing too fast on the car ahead.","gl":"fcw"},{"g":"adas","n":"Driver fatigue monitoring","tip":"Warns a tired or distracted driver.","gl":"dms"},{"g":"adas","n":"High beam <script>
(function(){
const $ = s => document.querySelector(s);
const view = $('#view'), main = $('#main');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtEGP = n => n == null ? '' : n.toLocaleString('en-US');
const CARS = DATA.cars;
const byId = Object.fromEntries(CARS.map(c => [c.id, c]));
if(!DATA.customer) $('#pricedate').textContent = 'Prices ' + DATA.priceDate;

/* settings, kept on this phone */
const CUST = !!DATA.customer; const BASE = CUST ? '../' : '';
const custP = () => new URLSearchParams(location.hash.slice(1));
const SET = Object.assign({theme:'auto', text:'normal', prices:true, name:'', lang:'en'}, CUST ? {} : (()=>{ try{ return JSON.parse(localStorage.getItem('byd-settings')||'{}'); }catch(e){ return {}; } })());
if(CUST){ const P = custP(); SET.lang = P.get('lang')==='ar' ? 'ar' : 'en'; SET.prices = P.get('p')!=='0'; document.documentElement.classList.add('cust'); }
SET.motion = true; SET.start = 'cars';
function saveSet(){ if(CUST) return; try{ localStorage.setItem('byd-settings', JSON.stringify(SET)); }catch(e){} }
function applySet(){
  const r = document.documentElement;
  if(SET.theme==='auto') delete r.dataset.theme; else r.dataset.theme = SET.theme;
  r.lang = SET.lang==='ar' ? 'ar' : 'en'; r.dir = SET.lang==='ar' ? 'rtl' : 'ltr';
  r.style.zoom = SET.text==='large' ? '1.12' : '';
  const metas = document.querySelectorAll('meta[name="theme-color"]');
  metas.forEach(m=>{ if(!m.dataset.media) m.dataset.media = m.getAttribute('media')||''; if(SET.theme==='auto'){ m.setAttribute('media', m.dataset.media); m.content = /dark/.test(m.dataset.media) ? '#0B0C0E' : '#FFFFFF'; } else { m.removeAttribute('media'); m.content = SET.theme==='dark' ? '#0B0C0E' : '#FFFFFF'; } });
}
applySet();

/* ---------- language and abbreviations ---------- */
const AR = DATA.ar || {};
const ABBR = (DATA.abbr||[]).map(([a,en,ar])=>({a, en, ar, re:new RegExp('(^|[^A-Za-z0-9-])(' + a.replace(/[.*+?^${}()|[\]\\/]/g, ch => '\\' + ch) + ')(?![A-Za-z0-9])')}));
const MISSING = new Set(); window.__missing = MISSING;
const NUM = /\d+(?:[.,]\d+)*/g;
// Translate one piece of text. Numbers become {0}, {1}... so "9 models" and "8 models" share one entry.
function T(s){
  if(SET.lang!=='ar' || s==null) return s;
  const m = String(s).match(/^([\s“”"‹›]*)([\s\S]*?)([\s“”"]*)$/); let [, a, core, b] = m;
  if(!core || !/[A-Za-z]/.test(core)) return s;
  let out = AR[core];
  if(out==null){ const nums=[]; const k = core.replace(NUM, x=>{ nums.push(x); return '{'+(nums.length-1)+'}'; }); const t = AR[k]; if(t!=null) out = t.replace(/\{(\d+)\}/g, (x,i)=>nums[i]??x); else { MISSING.add(k); return s; } }
  return a.replace('‹','›') + out + b;
}
// Put the full phrase next to an abbreviation, unless the full phrase is already there.
function expandAbbr(s){
  if(!s || !/[A-Z0-9]/.test(s)) return s;
  for(const x of ABBR){
    const full = SET.lang==='ar' ? x.ar : x.en;
    const m = s.match(x.re); if(!m) continue;
    if(s.toLowerCase().includes(x.en.toLowerCase()) || s.includes(x.ar)) continue;
    const at = m.index + m[1].length, end = at + x.a.length;
    if(s[at-1]==='(' && s[end]===')') s = s.slice(0,end) + ': ' + full + s.slice(end);
    else s = s.slice(0,end) + ' (' + full + ')' + s.slice(end);
  }
  return s;
}
const DONE = new WeakSet();
function localize(root){
  if(!root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement && n.parentElement.closest('script,style') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  for(const n of nodes){
    if(DONE.has(n)) continue; DONE.add(n);
    const p = n.parentElement; let v = n.nodeValue;
    if(!p.closest('.nm,.trd,.abl')) v = T(v);
    if(!p.closest('.nm,.noab,nav.tabs,.brand,#splash')) v = expandAbbr(v);
    if(v !== n.nodeValue) n.nodeValue = v;
  }
  if(SET.lang==='ar') root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(el=>{ if(DONE.has(el)) return; DONE.add(el); for(const at of ['placeholder','aria-label','title']){ const v = el.getAttribute(at); if(v) el.setAttribute(at, T(v)); } });
}
// The full phrases for abbreviations in a car's name, e.g. "DM-i: Dual Mode intelligent".
function nameAbbr(c){
  const out=[]; let s = ' '+c.name+' ';
  for(const x of ABBR){ const m = s.match(x.re); if(m){ out.push(x.a + ': ' + (SET.lang==='ar' ? x.ar : x.en)); s = s.replace(x.a,' '); } }
  return out.length ? '<div class="abl noab">'+esc(out.join(' · '))+'</div>' : '';
}

/* splash once per session */
const splash = $('#splash');
let seen = false; try{ seen = sessionStorage.getItem('byd-splash')==='1'; sessionStorage.setItem('byd-splash','1'); }catch(e){}
if(seen || matchMedia('(prefers-reduced-motion: reduce)').matches) splash.remove();
else setTimeout(()=>{ splash.classList.add('out'); setTimeout(()=>splash.remove(), 500); }, 1350);

function kindChip(c){ return `<span class="kind ${c.kind==='EV'?'ev':'hy'}">${esc(c.kindLabel)}</span>`; }
function priceFrom(c){ const p = c.trims.map(t=>t.price).filter(Boolean); return p.length ? Math.min(...p) : null; }
function priceHTML(n){ if(!SET.prices) return '<span class="small">Ask for price</span>'; return n==null ? '<span class="small">Not on price list</span>' : `<span class="price"><small>EGP</small>${fmtEGP(n)}</span>`; }
function keyAll(c,k){ const vals = c.trims.map(t=>t.key && t.key[k]).filter(v=>v!=null && v!==''); return [...new Set(vals)]; }
function keyShort(c,k){ const u=keyAll(c,k); if(!u.length) return '-'; return u.join(' / '); }
const img = (c, cls='') => `<img class="${cls}" src="${BASE}cars/${c.id}.jpg" alt="${esc(c.name)}" loading="lazy" decoding="async">`;

/* ---------- feature helpers ---------- */
const FEATS = DATA.features;
const BCARS = CARS.filter(c=>c.hasBrochure);
const shortName = c => c.short || c.name;
function carFeat(c,i){
  const sts = c.trims.map(t=>t.feat[i]||{s:'u'});
  const yes = c.trims.filter((t,j)=>sts[j].s==='y');
  const vals = [...new Set(sts.filter(s=>s.s==='y'&&s.v).map(s=>s.v))];
  if(yes.length===c.trims.length){
    if(vals.length>1) return {s:'y', v: c.trims.map((t,j)=>`${sts[j].v} ${t.name}`).join(' · ')};
    return {s:'y', v: vals[0]||''};
  }
  if(yes.length) return {s:'p', v: yes.map(t=>{ const s=sts[c.trims.indexOf(t)]; return t.name + (s.v?` ${s.v}`:''); }).join(', ') + ' only'};
  if(sts.some(s=>s.s==='n')) return {s:'n'};
  return {s:'u'};
}
const ST_LABEL = {y:'Standard on all trims', p:'Only on some trims', n:'Not available', u:'Not specified'};
function stChip(st, name){ return `<span class="st ${st.s}" title="${ST_LABEL[st.s]}"><span class="nm">${esc(name)}</span>${st.v?` <i>${esc(st.v)}</i>`:''}</span>`; }
function legendHTML(){ const anyU = BCARS.some(c=>FEATS.some((f,i)=>carFeat(c,i).s==='u')); return `<div class="legend">${['y','p','n'].concat(anyU?['u']:[]).map(s=>`<span class="st ${s}">${ST_LABEL[s]}</span>`).join('')}</div>`; }
function stCell(st){
  if(!st||st.s==='u') return '<span class="no" title="Not specified">?</span>';
  if(st.s==='n') return '<span class="no" title="Not available">✗</span>';
  return '<span class="yes">✓</span>' + (st.v?` <span>${esc(st.v)}</span>`:'');
}

/* ---------- cars list ---------- */
let carFilter = 'all';
const FILTERS = [['all','All'],['EV','Electric'],['PHEV','Plug-in hybrid'],['seven','7 seats'],['offroad','Off-road & pickup'],['u2m','Under 2M EGP']];
function passFilter(c,f){
  if(f==='all') return true;
  if(f==='EV'||f==='PHEV') return c.kind===f;
  if(f==='seven') return (c.seats||0)>=7;
  if(f==='offroad') return !!c.offroad;
  if(f==='u2m') return (priceFrom(c)||9e9) < 2000000;
  return true;
}
function renderCars(){
  const list = CARS.filter(c=>passFilter(c,carFilter)).sort((a,b)=>(a.discontinued?1:0)-(b.discontinued?1:0) || (priceFrom(a)||0)-(priceFrom(b)||0));
  view.innerHTML = `
    ${SET.name?`<div class="small" style="font-weight:600;margin-bottom:-12px"><span>Hi</span> <span class="nm">${esc(SET.name.split(' ')[0])}</span></div>`:''}
    <h1 class="pagetitle">Line-up</h1>
    <p class="pagesub">${CARS.length} models, cheapest first. Tap a car for everything about it.</p>
    <div class="chips" role="group" aria-label="Filter cars">${FILTERS.map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${k===carFilter}">${l}</button>`).join('')}</div>
    <div class="btnrow"><a class="btn red" href="#finder">Help me choose</a><button class="btn soft sharebtn" id="shareall" type="button">Share line-up</button></div>
    <div class="cars">${list.map(cardHTML).join('') || '<div class="empty">No cars match this filter.</div>'}</div>
    <section class="panel"><h3>Included with every BYD</h3><ul class="included">${DATA.included.map(i=>`<li>${esc(i)}</li>`).join('')}</ul><span class="small">Terms and conditions apply.</span></section>
    <footer class="about">BYD Showroom Guide · Prices as of ${esc(DATA.priceDate)}</footer>`;
  view.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{carFilter=b.dataset.f; draw(renderCars, false);});
  const sa = $('#shareall'); if(sa) sa.onclick = ()=>openShare({v:'all'}, 'BYD line-up');
}
// The same six figures on every car card. Range: electric range for EVs, total range for plug-in hybrids.
// Charging: DC fast charging, or AC where the car has no DC. Boot: the load tray on the pickup.
const CARD_STATS = [['range','km range'],['battery','kWh battery'],['power','hp'],['charge','kW charging'],['accel','s 0-100'],['boot','L boot'],['tank','L fuel tank'],['seats','seats'],['torque','N·m torque']];
function statVal(c,k){
  const vals = c.trims.map(t=>{ const K=t.key||{};
    if(k==='range') return c.kind==='EV' ? K.erange : (K.range||K.erange);
    if(k==='charge') return K.dc ? K.dc : (K.ac ? K.ac+' AC' : null);
    if(k==='boot') return K.boot || K.load;
    return K[k]; }).filter(v=>v!=null && v!=='').map(v=>String(v).replace(/^Up to /,''));
  const u = [...new Set(vals)];
  if(!u.length) return '-';
  if(u.length===1) return u[0];
  const n = v => parseFloat(String(v).replace(/,/g,'').match(/[\d.]+/)?.[0]);
  const s = u.slice().sort((a,b)=>n(a)-n(b));
  return s[0].replace(/ AC$/,'') + '-' + s[s.length-1];
}
function cardHTML(c){
  const stats = CARD_STATS.map(([k,l])=>{ const ev = k==='tank' && c.kind==='EV'; return `<div class="stat"><b>${esc(ev ? 'Electric' : statVal(c,k))}</b><span>${esc(ev ? 'no fuel tank' : l)}</span></div>`; }).join('');
  const multi = SET.prices && c.trims.filter(t=>t.price).length>1;
  return `<div class="card${c.discontinued?' gone':''}"><a class="cardlink" href="#${CUST ? custHash({id:c.id}) : 'car-'+c.id}">
    <div class="ph">${img(c)}<div class="onimg">${kindChip(c)}${c.discontinued?' <span class="kind gone">No longer in Egypt</span>':''}</div></div>
    <div class="body">
      <div class="row1"><div><h3 class="nm">${esc(c.name)}</h3>${nameAbbr(c)}<div class="type">${esc(c.body)}</div></div><div>${c.discontinued ? '<span class="small">No longer available</span>' : (multi?'<div class="from">from</div>':'') + priceHTML(priceFrom(c))}</div></div>
    </div></a>

}

function cellVal(v){
  if(v==null||v===''||v==='-'||v==='–') return '<span class="no">-</span>';

}
function trimDiffs(c){

}
function featureChecklist(c){

function hlText(text,q){
  if(q) return '<span class="trd">' + hlRaw(expandAbbr(T(text)), q) + '</span>';
  return esc(text);
}
function hlRaw(text,q){
  const t = esc(text);
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if(!terms.length) return t;
  return t.replace(new RegExp('('+terms.join('|')+')','gi'),'<span class="hl">$1</span>');
}
function synonymHit(t,hay){ const syn = DATA.synonyms[t]; return syn ? syn.some(x=>hay.includes(x)) : false; }
function rowMatches(s,r,q){
  if(!q) return true;
  const base = s.title+' '+r.label+' '+Object.values(r.values).join(' ');
  const hay = (base+' '+T(s.title)+' '+T(r.label)+' '+Object.values(r.values).map(T).join(' ')).toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(t=>hay.includes(t)||synonymHit(t,hay));
}
function specsHTML(c,q){
  const multi = c.trims.length>1; let any=false;

    const rows = s.rows.filter(r=>rowMatches(s,r,q));
    if(!rows.length) return '';
    any=true;
    return `<details class="spec"${q?' open':''}><summary>${esc(s.title)}<span class="cnt">${rows.length}</span></summary><div class="specrows">${rows.map(r=>{
      const vals = c.trims.map(t=>r.values[t.name]);
      const same = vals.every(v=>v===vals[0]);
      const val = (!multi||same) ? cellVal(vals[0]) : c.trims.map((t,i)=>`<span class="tv"><i>${esc(t.name)}</i>${cellVal(vals[i])}</span>`).join('');
      return `<div class="sr"><span class="lab">${hlText(r.label,q)}${r.note?` <span class="small">(${esc(r.note)})</span>`:''}</span><span class="val">${val}</span></div>`;
    }).join('')}</div></details>`;
  }).join('');
  return any ? html : `<div class="empty">Nothing in this car's specs matches <span class="nm">“${esc(q)}”</span></div>`;
}

/* ---------- compare ---------- */
let cmpSel = null; let cmpDiffOnly = false;
try{ const s = JSON.parse(localStorage.getItem('byd-cmp')||'null'); if(Array.isArray(s)) cmpSel = s; }catch(e){}
const allTrims = () => BCARS.flatMap(c=>c.trims.map(t=>({id:c.id+'|'+t.name, car:c, trim:t, label: shortName(c) + (c.trims.length>1?' '+t.name:'')})));
const CMPROWS = [
  ['g','Price & type'],
  ['price','Price (EGP)','low'],['kindLabel','Powertrain'],['body','Body'],['seats','Seats','high'],
  ['g','Performance'],
  ['power','Power (hp)','high'],['torque','Torque (N·m)','high'],['accel','0-100 km/h (s)','low'],['top','Top speed (km/h)','high'],['drive','Drive'],['engine','Engine'],
  ['g','Battery, range & charging'],
  ['battery','Battery (kWh)','high'],['erange','Electric range (km)','high'],['range','Total range (km)','high'],['fuel','Fuel use (L/100km)','low'],['energy','Energy use (kWh/100km)','low'],['home','Home charging speed (kW)','high'],['homefull','Home full charge','low'],['ac','Car max AC charging (kW)','high'],['dc','DC charging (kW)','high'],['dctime','DC 30-80% time','low'],
  ['g','Size & practicality'],
  ['length','Length (mm)'],['width','Width (mm)'],['height','Height (mm)'],['wheelbase','Wheelbase (mm)','high'],['clearance','Ground clearance (mm)','high'],['boot','Boot (L)','high'],['bootmax','Boot, seats down (L)','high'],['load','Pickup load volume (L)'],['weight','Kerb weight (kg)'],['towing','Towing (kg)','high'],['payload','Payload (kg)','high'],['tank','Fuel tank (L)'],['wheels','Wheels'],
  ['g','Screens & comfort'],
  ['screen','Centre screen (in)','high'],['cluster','Driver display (in)','high'],['speakers','Speakers','high'],['airbags','Airbags','high'],
];
function renderCompare(){
  const opts = allTrims();
  if(!cmpSel || !cmpSel.length) cmpSel = [opts[1]?.id, opts[3]?.id].filter(Boolean);
  cmpSel = cmpSel.filter(id=>opts.some(o=>o.id===id));
  const sel = cmpSel.map(id=>opts.find(o=>o.id===id));
  try{ localStorage.setItem('byd-cmp', JSON.stringify(cmpSel)); }catch(e){}
  let body='';
  for(const r of CMPROWS){
    if(r[0]==='g'){ body+=`<tr class="grp"><th colspan="${sel.length+1}">${esc(r[1])}</th></tr>`; continue; }
    const [k,l,dir]=r;
    if(k==='price' && !SET.prices) continue;
    const vals = sel.map(o=> k==='price'? o.trim.price : (k==='kindLabel'||k==='body') ? o.car[k] : o.trim.key[k]);
    if(vals.every(v=>v==null||v==='')) continue;
    if(cmpDiffOnly && sel.length>1 && vals.every(v=>String(v)===String(vals[0]))) continue;
    const nums = vals.map(v=> v==null? null : parseFloat(String(v).replace(/,/g,'').match(/[\d.]+/)?.[0]));
    let best=null;
    if(dir && sel.length>1){ const valid = nums.filter(n=>n!=null&&!isNaN(n)); if(valid.length>1){ const b = dir==='high'?Math.max(...valid):Math.min(...valid); if(valid.filter(n=>n===b).length<valid.length) best=b; } }
    body+=`<tr><th>${esc(l)}</th>${vals.map((v,i)=>`<td class="${best!=null&&nums[i]===best?'best':''}">${v==null||v===''?'<span class="no">-</span>':esc(k==='price'?fmtEGP(v):v)}</td>`).join('')}</tr>`;
  }
  for(const [g,title] of Object.entries(DATA.groups)){
    let part='';
    FEATS.forEach((f,i)=>{
      if(f.g!==g) return;
      const sts = sel.map(o=>o.trim.feat[i]||{s:'u'});
      if(sts.every(s=>s.s==='u')) return;
      const key = s => s.s + '|' + (s.v||'');
      if(cmpDiffOnly && sel.length>1 && sts.every(s=>key(s)===key(sts[0]))) return;
      part+=`<tr><th>${esc(f.n)}</th>${sts.map(s=>`<td>${stCell(s)}</td>`).join('')}</tr>`;
    });
    if(part) body+=`<tr class="grp"><th colspan="${sel.length+1}">${esc(title)}</th></tr>`+part;
  }

    <h1 class="pagetitle">Compare</h1>
    <p class="pagesub">Pick up to 3 cars or trims.</p>
    <div class="picker">${opts.map(o=>`<button class="chip" data-id="${esc(o.id)}" aria-pressed="${cmpSel.includes(o.id)}"><span class="nm">${esc(o.label)}</span></button>`).join('')}</div>
    <label class="toggle"><input type="checkbox" class="switch" id="diffonly" ${cmpDiffOnly?'checked':''}> Show only differences</label>
    ${sel.length>1 ? '<button class="btn soft sharebtn" id="sharecmp" type="button">Share this comparison with customer</button>' : ''}
    ${sel.length?`<div class="cmpwrap"><table class="cmp"><thead><tr><th></th>${sel.map(o=>`<th>${img(o.car)}<span class="nm">${esc(o.label)}</span></th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>
    <span class="small">▲ marks the best number in a row. ✓ standard, ✗ not available.</span>`:'<div class="empty">Pick a car above to start.</div>'}
  `;
  view.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.id;
    if(cmpSel.includes(id)) cmpSel=cmpSel.filter(x=>x!==id);
    else { cmpSel.push(id); if(cmpSel.length>3) cmpSel.shift(); }
    draw(renderCompare, false);
  });
  $('#diffonly').onchange=e=>{cmpDiffOnly=e.target.checked; draw(renderCompare, false);};
  const sc = $('#sharecmp'); if(sc) sc.onclick = ()=>openShare({v:'cmp', ids:cmpSel.join(',')}, sel.map(o=>o.label).join(' vs '));
}

/* ---------- finder ---------- */
let fd = {budget:'any', power:'any', need:'any'};
function renderFinder(){
  const res = CARS.filter(c=>!c.discontinued).filter(c=>{
    const p = priceFrom(c);

    if(fd.power!=='any' && c.kind!==fd.power) return false;

/* ---------- global search ---------- */
function renderSearch(q){
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const groups = [];
  const carHits = CARS.filter(c=>terms.every(t=>[c.name,c.kindLabel,c.body,c.tagline].map(x=>x+' '+T(x)).join(' ').toLowerCase().includes(t)));
  for(const c of CARS){
    const hits=[];
    c.sections.forEach(s=>s.rows.forEach(r=>{ if(rowMatches(s,r,q)) hits.push({s,r}); }));
    (c.pitch||[]).forEach(p=>{ const h=(p+' '+T(p)).toLowerCase(); if(terms.every(t=>h.includes(t)||synonymHit(t,h))) hits.push({pitch:p}); });
    if(hits.length) groups.push({c,hits});
  }
  const glHits = DATA.glossary.filter(g=>{ const h=(g.term+' '+g.text+' '+T(g.term)+' '+T(g.text)).toLowerCase(); return terms.every(t=>h.includes(t)||synonymHit(t,h)); });
  const fHits = FEATS.map((f,i)=>({f,i})).filter(({f})=>{ const h=[f.n,f.tip,DATA.groups[f.g]].map(x=>x+' '+T(x)).join(' ').toLowerCase(); return terms.every(t=>h.includes(t)||synonymHit(t,h)); }).filter(({i})=>BCARS.some(c=>carFeat(c,i).s!=='u'));
  const total = carHits.length + groups.reduce((a,g)=>a+g.hits.length,0) + glHits.length + fHits.length;
  view.innerHTML = `
    <div class="section-h"><h2>Results</h2><span class="small">${total} <span class="nm">“${esc(q)}”</span></span></div>
    ${carHits.length?`<div class="cars">${carHits.map(cardHTML).join('')}</div>`:''}
    ${fHits.length?`<div class="grouphead"><h3>Which cars have it</h3></div>${fHits.slice(0,6).map(({f,i})=>`<section class="fcard"><div class="fh"><h3>${hlText(f.n,q)}</h3>${f.gl?`<a class="what" href="#tech-${f.gl}">What is it?</a>`:''}</div><div class="sts">${BCARS.map(c=>({c,st:carFeat(c,i)})).sort((a,b)=>'ypnu'.indexOf(a.st.s)-'ypnu'.indexOf(b.st.s)).map(x=>stChip(x.st,shortName(x.c))).join('')}</div></section>`).join('')}`:''}
    ${glHits.length?`<div class="grouphead"><h3>BYD tech</h3></div><div class="results">${glHits.map(g=>`<a class="res" href="#tech-${esc(g.id)}"><span class="where">Explained</span><span class="what"><span>${hlText(g.term,q)}</span></span><span class="small">${esc(g.text.slice(0,140))}…</span></a>`).join('')}</div>`:''}
    ${groups.map(g=>`<div class="grouphead"><h3 class="nm">${esc(g.c.name)}</h3>${kindChip(g.c)}</div><div class="results">${g.hits.slice(0,30).map(h=> h.pitch ? `<a class="res" href="#car-${g.c.id}"><span class="where">Talking point</span><span>${hlText(h.pitch,q)}</span></a>` : `<a class="res" href="#car-${g.c.id}"><span class="where">${esc(h.s.title)}</span><span class="what"><span>${hlText(h.r.label,q)}</span><span class="val">${g.c.trims.length>1 && new Set(g.c.trims.map(t=>h.r.values[t.name])).size>1 ? g.c.trims.map(t=>esc(t.name)+': '+cellVal(h.r.values[t.name])).join('<br>') : cellVal(h.r.values[g.c.trims[0].name])}</span></span></a>`).join('')}${g.hits.length>30?`<span class="small">+${g.hits.length-30} more in this car</span>`:''}</div>`).join('')}
    ${!total?`<div class="empty">No match for <span class="nm">“${esc(q)}”</span>. <span>Try a simpler word like "camera", "range", "seats" or "charging".</span></div>`:''}`;
}

  document.body.appendChild(bg); localize(bg);

  const link = () => { const P = new URLSearchParams(); P.set('v', what.v); if(what.id) P.set('id', what.id); if(what.ids) P.set('ids', what.ids); P.set('lang', lang); if(!bg.querySelector('#sh-p').checked) P.set('p','0'); const n=bg.querySelector('#sh-n').value.trim(), ph=bg.querySelector('#sh-ph').value.trim(); if(n) P.set('n', n.slice(0,40)); if(ph) P.set('ph', ph.slice(0,20)); return base + '#' + P.toString(); };
  const upd = () => { bg.querySelector('#sh-open').href = link(); };
  bg.querySelectorAll('#sh-lang button').forEach(b=>b.onclick=()=>{ lang=b.dataset.v; bg.querySelectorAll('#sh-lang button').forEach(x=>x.setAttribute('aria-pressed', x===b)); upd(); });
  bg.querySelectorAll('input').forEach(i=>i.addEventListener('input', upd)); bg.querySelector('#sh-p').onchange = upd; upd();
  const close = () => bg.remove();
  bg.addEventListener('click', e=>{ if(e.target===bg) close(); });
  bg.querySelector('#sh-close').onclick = close;
  const msg = t => { bg.querySelector('#sh-msg').textContent = T(t); };
  bg.querySelector('#sh-copy').onclick = async () => { try{ await navigator.clipboard.writeText(link()); msg('Link copied. Paste it in WhatsApp or a message.'); }catch(e){ prompt('Copy this link', link()); } };
  bg.querySelector('#sh-share').onclick = async () => { const url = link(); if(navigator.share){ try{ await navigator.share({ title:'BYD', text: title, url }); close(); }catch(e){} } else { try{ await navigator.clipboard.writeText(url); msg('Link copied. Paste it in WhatsApp or a message.'); }catch(e){ prompt('Copy this link', url); } } };
  setTimeout(()=>bg.querySelector('#sh-n').focus(), 50);
}

/* ---------- routing ---------- */
function draw(fn, animate=true){ main.classList.toggle('anim', animate); fn(); localize(view); }
const q = $('#q'), qclear = $('#qclear');
function route(){
  if(CUST) return routeCust();
  const h = location.hash.replace('#','') || SET.start || 'cars';
  const tab = h.startsWith('car-') || h==='finder' ? 'cars' : h.startsWith('tech') ? 'tech' : h;
  document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current', a.dataset.tab===tab ? 'page' : 'false'));
  if(q.value.trim()){ q.value=''; qclear.hidden=true; }
  if(!h.startsWith('tech-')) window.scrollTo(0,0);
  if(h.startsWith('car-')) draw(()=>renderCar(h.slice(4)));
  else if(h==='compare') draw(renderCompare);
  else if(h==='finder') draw(renderFinder);
  else if(h==='features') draw(renderFeatures);
  else if(h==='rankings') draw(renderRankings);
  else if(h.startsWith('tech')) draw(()=>renderLearn(h.slice(5)));
  else if(h==='profile') draw(renderProfile);
  else draw(renderCars);
}
q.addEventListener('input',()=>{
  const v=q.value.trim(); qclear.hidden=!v;
  if(v.length>=2){ window.scrollTo(0,0); draw(()=>renderSearch(v), false); } else if(!v) route();
});
qclear.onclick=()=>{ q.value=''; qclear.hidden=true; route(); q.focus(); };
window.addEventListener('hashchange', route);
document.addEventListener('click', e => { const b = e.target.closest('.specbtn'); if(!b) return; const s = b.nextElementSibling; s.hidden = !s.hidden; b.setAttribute('aria-expanded', String(!s.hidden)); });
// The header floats over the page (fixed), so hiding the search bar never moves the content.
// The page is pushed down by the header's full height, measured here.
{ let lastY = scrollY, anchor = scrollY, dir = 0, lockUntil = 0; const hdr = document.querySelector('header.top');
  const setH = () => { if(!hdr.classList.contains('hs')) document.documentElement.style.setProperty('--hdr', hdr.offsetHeight + 'px'); };
  setH(); addEventListener('resize', setH); if(document.fonts) document.fonts.ready.then(setH);
  const toggle = on => { if(hdr.classList.contains('hs') === on) return; hdr.classList.toggle('hs', on); lockUntil = performance.now() + 400; };
  addEventListener('scroll', () => { const y = scrollY; if(document.activeElement === $('#q') || q.value) { toggle(false); lastY = y; return; }
    const d = y - lastY; if(d>0 && dir<=0){ anchor=lastY; dir=1; } else if(d<0 && dir>=0){ anchor=lastY; dir=-1; }
    lastY = y;
    if(y < 40) { toggle(false); return; }
    if(performance.now() < lockUntil) return;
    if(dir>0 && y-anchor>24 && y>80) toggle(true); else if(dir<0 && anchor-y>24) toggle(false); }, { passive:true }); }
localize(document.querySelector('header.top')); localize(document.querySelector('nav.tabs')); localize(document.getElementById('splash'));
route();

/* offline: cache the app on the phone */
if('serviceWorker' in navigator && location.protocol==='https:'){ addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
})();
</script>
